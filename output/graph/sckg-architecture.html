<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCKG: GRAFT Build and EG-POT Architecture</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --panel: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #dbe3ee;
      --accent: #2563eb;
      --edge: #94a3b8;
      --egpot: #dc2626;
      --egpot-seed: #0891b2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .app {
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr;
      height: 100vh;
    }
    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 18px;
      overflow: auto;
    }
    main {
      position: relative;
      min-width: 0;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
    }
    .stats {
      color: var(--muted);
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 650;
      color: #334155;
    }
    input, select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      background: #fff;
      color: var(--ink);
    }
    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      margin-top: 18px;
    }
    .egpot-summary {
      display: none;
      margin: 14px 0 0;
      padding: 10px;
      border: 1px solid #fecaca;
      border-radius: 6px;
      background: #fff7f7;
      color: #7f1d1d;
    }
    .egpot-summary.active {
      display: block;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #334155;
    }
    .swatch {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex: 0 0 auto;
    }
    .details {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: #334155;
      word-break: break-word;
    }
    .details strong {
      display: block;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .details-row {
      margin: 3px 0;
    }
    .details-code {
      max-height: 220px;
      overflow: auto;
      margin: 10px 0 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0f172a;
      color: #e2e8f0;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre;
    }
    .related-block {
      margin-top: 12px;
    }
    .related-title {
      margin-bottom: 6px;
      font-weight: 700;
      color: var(--ink);
    }
    .related-list {
      display: grid;
      gap: 6px;
    }
    .related-item {
      width: 100%;
      height: auto;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
      background: #fff;
      text-align: left;
      cursor: pointer;
    }
    .related-item:hover {
      border-color: var(--accent);
      background: #eff6ff;
    }
    .relation-chip {
      display: inline-block;
      margin-right: 6px;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
    }
    .inspect-section {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .inspect-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #334155;
      font-weight: 700;
    }
    .count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }
    .item-list {
      display: grid;
      gap: 6px;
      max-height: 210px;
      overflow: auto;
      padding-right: 2px;
    }
    .list-item {
      width: 100%;
      height: auto;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 8px;
      background: #fff;
      color: #1e293b;
      text-align: left;
      cursor: pointer;
    }
    .list-item:hover, .list-item.active {
      border-color: var(--accent);
      background: #eff6ff;
    }
    .item-name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 650;
    }
    .item-meta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }
    svg {
      display: block;
      width: 100%;
      height: 100vh;
      cursor: grab;
      touch-action: none;
      background:
        linear-gradient(#e2e8f0 1px, transparent 1px),
        linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
      background-size: 32px 32px;
    }
    svg.dragging {
      cursor: grabbing;
    }
    .link {
      stroke: var(--edge);
      stroke-opacity: 0.42;
    }
    .link-hit {
      stroke: transparent;
      stroke-width: 10px;
      cursor: pointer;
    }
    .link.selected {
      stroke: var(--accent);
      stroke-opacity: 1;
    }
    .link.egpot {
      stroke: var(--egpot);
      stroke-opacity: 0.95;
    }
    .node circle {
      stroke: #fff;
      stroke-width: 0.9px;
      opacity: 0.88;
      cursor: pointer;
    }
    .node .hit-circle {
      fill: transparent;
      stroke: transparent;
      cursor: pointer;
    }
    .node.selected circle:not(.hit-circle) {
      stroke: var(--accent);
      stroke-width: 1.8px;
      opacity: 1;
    }
    .node.egpot circle:not(.hit-circle) {
      stroke: var(--egpot);
      stroke-width: 2.4px;
      opacity: 1;
    }
    .node.egpot-seed circle:not(.hit-circle) {
      stroke: var(--egpot-seed);
      stroke-width: 2.4px;
    }
    .node text {
      pointer-events: none;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 3px;
      fill: #0f172a;
      font-size: 11px;
    }
    .edge-label {
      fill: #64748b;
      font-size: 9px;
      pointer-events: none;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 3px;
    }
    .toolbar {
      position: absolute;
      right: 16px;
      top: 16px;
      display: flex;
      gap: 8px;
    }
    button {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      background: #fff;
      color: #1e293b;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      aside { max-height: 42vh; border-right: 0; border-bottom: 1px solid var(--line); }
      svg { height: 58vh; }
      .toolbar { top: auto; bottom: 12px; right: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>SCKG: GRAFT Build and EG-POT Architecture</h1>
      <div class="stats" id="stats"></div>
      <div class="egpot-summary" id="egpotSummary"></div>

      <label for="search">Search symbols</label>
      <input id="search" type="search" placeholder="Qualified name, file, kind">

      <label for="relation">Relation filter</label>
      <select id="relation">
        <option value="">All relations</option>
      </select>

      <label for="layer">Architecture layer</label>
      <select id="layer">
        <option value="">All layers</option>
      </select>

      <div class="legend" id="legend"></div>
      <div class="details" id="details">Select a node or edge to inspect it.</div>
      <div class="inspect-section">
        <div class="inspect-title">Nodes <span class="count" id="nodeCount"></span></div>
        <div class="item-list" id="nodeList"></div>
      </div>
      <div class="inspect-section">
        <div class="inspect-title">Edges <span class="count" id="edgeCount"></span></div>
        <div class="item-list" id="edgeList"></div>
      </div>
    </aside>
    <main>
      <div class="toolbar">
        <button id="zoomIn" title="Zoom in">+</button>
        <button id="zoomOut" title="Zoom out">-</button>
        <button id="fit" title="Fit graph to view">Fit</button>
        <button id="labels" title="Toggle labels">Labels</button>
        <button id="egpotOnly" title="Show only EG-POT-selected nodes and edges">EG-POT</button>
      </div>
      <svg id="graph" role="img" aria-label="Interactive semantic code graph"></svg>
    </main>
  </div>
  <script>
    const graph = {"nodes":[{"id":"sym_007790ba514b163c701a8dbf41b57db8","label":"main.py","qualifiedName":"file::src/sckg/cli/main.py","kind":"file","file":"src/sckg/cli/main.py","line":1,"sourceText":"# File: src/sckg/cli/main.py\n# Lines: 208","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_74d89889c992fafda006731a0fcd7c76","label":"os","qualifiedName":"module::os","kind":"module","file":"src/sckg/cli/main.py","line":1,"sourceText":"","layer":"Ldep","color":"#475569","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_79db185b3943b71081f19e38c997aff0","label":"typer","qualifiedName":"module::typer","kind":"module","file":"src/sckg/cli/main.py","line":1,"sourceText":"","layer":"Ldep","color":"#475569","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_d0f4cd932723af3cd8adc024238719a3","label":"make_store","qualifiedName":"src/sckg/cli/main.py:make_store","kind":"function","file":"src/sckg/cli/main.py","line":23,"sourceText":"def make_store() -> GraphStore:\n    if os.getenv(\"SCKG_STORE\", \"json\").lower() == \"neo4j\":\n        from sckg.graph.neo4j_store import Neo4jGraphStore\n\n        return Neo4jGraphStore(\n            os.getenv(\"NEO4J_URI\", \"bolt://localhost:7687\"),\n            os.getenv(\"NEO4J_USER\", \"neo4j\"),\n            os.getenv(\"NEO4J_PASSWORD\", \"sckg-password\"),\n        )\n    return JsonGraphStore(Path(os.getenv(\"SCKG_JSON_STORE\", \".sckg/graph.json\")))","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_5a7ab144715f0fbcddbb48a0b5027caa","label":"_print_symbols","qualifiedName":"src/sckg/cli/main.py:_print_symbols","kind":"function","file":"src/sckg/cli/main.py","line":35,"sourceText":"def _print_symbols(symbols) -> None:\n    for symbol in symbols:\n        typer.echo(f\"{symbol.qualified_name}\\t{symbol.kind.value}\\t{symbol.file_path}:{symbol.start_line}\")","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_a9da1a9ff84237ddce1f5a1454b35a7d","label":"index","qualifiedName":"src/sckg/cli/main.py:index","kind":"function","file":"src/sckg/cli/main.py","line":41,"sourceText":"def index(\n    repo: Annotated[Path, typer.Argument(exists=True)] ,\n    architecture: str = typer.Option(\"lnir\", help=\"lnir or graft\"),\n    workspace: bool = typer.Option(False, help=\"Treat path as a GRAFT workspace YAML file\"),\n    lineage: bool = typer.Option(False, help=\"Add Git commit TOUCHES edges to a GRAFT graph\"),\n    max_commits: int = typer.Option(200, help=\"Maximum Git commits for lineage\"),\n) -> None:\n    pipeline = IndexingPipeline(make_store(), {\"architecture\": architecture,\n                                              \"lineage\": lineage, \"max_commits\": max_commits})\n    report = pipeline.index_workspace(repo) if workspace else pipeline.index(repo)\n    typer.echo(\n        f\"indexed files={report.build.files} symbols={report.build.symbols} \"\n        f\"relations={report.build.relations}\"\n    )\n    typer.echo(f\"relation_counts={report.manifest.relation_counts}\")","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_9e306707b8b5657dbc5cd75ef85e1a49","label":"stats","qualifiedName":"src/sckg/cli/main.py:stats","kind":"function","file":"src/sckg/cli/main.py","line":59,"sourceText":"def stats(repo: Annotated[Path | None, typer.Argument()] = None) -> None:\n    _ = repo\n    typer.echo(make_store().stats())","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_f3e3006dbaf9e109de41c0aff2a1eaca","label":"find_symbol","qualifiedName":"src/sckg/cli/main.py:find_symbol","kind":"function","file":"src/sckg/cli/main.py","line":65,"sourceText":"def find_symbol(query: str) -> None:\n    _print_symbols(make_store().find_symbol(query))","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_19d71c446fb25685b586575c02f8785d","label":"definition","qualifiedName":"src/sckg/cli/main.py:definition","kind":"function","file":"src/sckg/cli/main.py","line":70,"sourceText":"def definition(symbol: str) -> None:\n    hit = make_store().get_definition(symbol)\n    if hit:\n        _print_symbols([hit])","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_0424c9dca3314c581c33726c0f4badbd","label":"references","qualifiedName":"src/sckg/cli/main.py:references","kind":"function","file":"src/sckg/cli/main.py","line":77,"sourceText":"def references(symbol: str) -> None:\n    _print_symbols(make_store().get_references(symbol))","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_2d50a4f44f27cc480012a3e680b54adb","label":"callers","qualifiedName":"src/sckg/cli/main.py:callers","kind":"function","file":"src/sckg/cli/main.py","line":82,"sourceText":"def callers(symbol: str) -> None:\n    _print_symbols(make_store().get_callers(symbol))","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_430c404aa263b299250db86643456659","label":"callees","qualifiedName":"src/sckg/cli/main.py:callees","kind":"function","file":"src/sckg/cli/main.py","line":87,"sourceText":"def callees(symbol: str) -> None:\n    _print_symbols(make_store().get_callees(symbol))","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_e853211680ea50e2ef8e3d45a9ae43fe","label":"neighbors","qualifiedName":"src/sckg/cli/main.py:neighbors","kind":"function","file":"src/sckg/cli/main.py","line":92,"sourceText":"def neighbors(symbol: str, depth: int = 1) -> None:\n    symbols, relations = make_store().get_neighbors(symbol, depth=depth)\n    _print_symbols(symbols)\n    typer.echo(f\"relations={len(relations)}\")","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_2481b99a794b649bf13d4a3ec90578e4","label":"subgraph","qualifiedName":"src/sckg/cli/main.py:subgraph","kind":"function","file":"src/sckg/cli/main.py","line":99,"sourceText":"def subgraph(symbol: str, depth: int = 1) -> None:\n    symbols, relations = make_store().get_subgraph([symbol], depth=depth)\n    _print_symbols(symbols)\n    typer.echo(f\"relations={len(relations)}\")","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_6b7124b86562ae89c539461eae380eeb","label":"path","qualifiedName":"src/sckg/cli/main.py:path","kind":"function","file":"src/sckg/cli/main.py","line":106,"sourceText":"def path(source: str, target: str) -> None:\n    for relation in make_store().explain_path(source, target):\n        typer.echo(f\"{relation.source_symbol_id} {relation.relation_type.value} {relation.target_symbol_id}\")","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_07d20ee428d009b515ab513a3b6fa1c9","label":"search","qualifiedName":"src/sckg/cli/main.py:search","kind":"function","file":"src/sckg/cli/main.py","line":112,"sourceText":"def search(query: str) -> None:\n    _print_symbols(make_store().find_symbol(query))","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_2248f15dd092a747a68dfcb9c9093816","label":"retrieve","qualifiedName":"src/sckg/cli/main.py:retrieve","kind":"function","file":"src/sckg/cli/main.py","line":117,"sourceText":"def retrieve(\n    issue: str,\n    repo: Path = Path(\".\"),\n    token_budget: int | None = None,\n    strategy: str = \"hybrid\",\n    max_hops: int | None = None,\n    beam_width: int | None = None,\n    explain: bool = False,\n    trace: Path | None = None,\n    config: Path | None = None,\n    suppress_hubs: bool | None = typer.Option(None, \"--suppress-hubs/--no-suppress-hubs\"),\n    hub_degree_threshold: int | None = None,\n    use_hash_sim: bool = False,\n    embedding_provider: str | None = None,\n    mcts: bool | None = typer.Option(None, \"--mcts/--no-mcts\"),\n    simulation_budget: int | None = None,\n    ucb_c: float | None = None,\n) -> None:\n    store = make_store()\n    settings = load_yaml(config) if config else {}\n    egpot = settings.setdefault(\"egpot\", {})\n    if not isinstance(egpot, dict):\n        raise typer.BadParameter(\"egpot config must be a mapping\")\n    for key, value in {\n        \"hub_suppression_enabled\": suppress_hubs, \"hub_degree_threshold\": hub_degree_threshold,\n        \"embedding_provider\": \"hashing\" if use_hash_sim else embedding_provider,\n        \"mcts_enabled\": mcts, \"simulation_budget\": simulation_budget, \"ucb_c\": ucb_c,\n    }.items():\n        if value is not None:\n            egpot[key] = value\n    result = RetrievalPipeline(store, repo.resolve(), settings).retrieve(\n        issue,\n        token_budget,\n        strategy=strategy,\n        max_hops=max_hops,\n        beam_width=beam_width,\n    )\n    if explain and result.egpot_result is not None:\n        typer.echo(explain_traversal(result.egpot_result))\n        typer.echo(\"\")\n    if trace and result.egpot_result is not None:\n        EGPOTTraverser(store).write_trace(result.egpot_result, trace)\n        typer.echo(f\"wrote EG-POT trace {trace}\")\n    typer.echo(result.context)","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_fdedd47a5111790dc42d10d2731c7428","label":"relation_types","qualifiedName":"src/sckg/cli/main.py:relation_types","kind":"function","file":"src/sckg/cli/main.py","line":164,"sourceText":"def relation_types() -> None:\n    for relation_type in RelationType:\n        typer.echo(relation_type.value)","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_f4595267050c4b919be941e2e9d24e17","label":"visualize","qualifiedName":"src/sckg/cli/main.py:visualize","kind":"function","file":"src/sckg/cli/main.py","line":170,"sourceText":"def visualize(\n    output: Path = Path(\".sckg/graph.html\"),\n    symbol: str | None = None,\n    depth: int = 1,\n    limit: int = 800,\n    egpot_trace: Path | None = None,\n    compare_trace: list[Path] = typer.Option([], \"--compare-trace\"),\n) -> None:\n    store = make_store()\n    if symbol:\n        symbols, relations = store.get_subgraph([symbol], depth=depth)\n        title = f\"SCKG Subgraph: {symbol}\"\n    elif isinstance(store, JsonGraphStore):\n        symbols = list(store.symbols.values())[:limit]\n        selected = {item.id for item in symbols}\n        relations = [\n            relation\n            for relation in store.relations.values()\n            if relation.source_symbol_id in selected and relation.target_symbol_id in selected\n        ]\n        title = \"SCKG Graph\"\n    else:\n        raise typer.BadParameter(\"Full graph visualization currently requires the JSON backend or --symbol.\")\n\n    trace_data = None\n    if egpot_trace:\n        trace_data = json.loads(egpot_trace.read_text(encoding=\"utf-8\"))\n        title = f\"{title} + EG-POT\"\n    if compare_trace and not trace_data:\n        raise typer.BadParameter(\"--compare-trace requires --egpot-trace\")\n    comparisons = {f\"{index + 1}. {path.stem}\": json.loads(path.read_text(encoding=\"utf-8\"))\n                   for index, path in enumerate(compare_trace)}\n    path = write_graph_html(output, symbols, relations, title, egpot_trace=trace_data,\n                            comparison_traces=comparisons)\n    typer.echo(f\"wrote {path} with {len(symbols)} nodes and {len(relations)} relations\")","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_846039fc1c1aa9d06a0953224764bf1c","label":"adapter.py","qualifiedName":"file::src/sckg/graft/adapter.py","kind":"file","file":"src/sckg/graft/adapter.py","line":1,"sourceText":"# File: src/sckg/graft/adapter.py\n# Lines: 114","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_94c868868a62fb67000ee180da58ce6c","label":"_plain","qualifiedName":"src/sckg/graft/adapter.py:_plain","kind":"function","file":"src/sckg/graft/adapter.py","line":30,"sourceText":"def _plain(value: Any) -> Any:\n    if isinstance(value, (str, int, float, bool)) or value is None:\n        return value\n    if isinstance(value, dict):\n        return {str(key): _plain(item) for key, item in value.items()}\n    if isinstance(value, (list, tuple)):\n        return [_plain(item) for item in value]\n    return str(value)","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_9ee8eefcd81049b1357736680da60cea","label":"graph_to_document","qualifiedName":"src/sckg/graft/adapter.py:graph_to_document","kind":"function","file":"src/sckg/graft/adapter.py","line":40,"sourceText":"def graph_to_document(graph: Any, root: Path, *, identity: str | None = None,\n                      source_roots: dict[str, Path] | None = None) -> LNIRDocument:\n    \"\"\"Preserve GRAFT node IDs, layers, parallel edges, and hyper-edge metadata.\"\"\"\n    root = root.resolve()\n    repo_id = repository_id(identity or str(root))\n    commit = current_commit(root)\n    repository = RepositoryNode(\n        id=repo_id, path=str(root), git_remote=remote_url(root), commit_id=commit,\n        metadata={\"architecture\": \"graft\"},\n    )\n    files: dict[str, FileNode] = {}\n    symbols: dict[str, Symbol] = {}\n    node_ids: dict[str, str] = {}\n    for raw_id, data in graph.nodes(data=True):\n        raw = str(raw_id)\n        path = str(data.get(\"file\") or \"\").replace(\"\\\\\", \"/\")\n        if not path and raw.startswith(\"file::\"):\n            path = raw.removeprefix(\"file::\")\n        if not path:\n            path = \"<workspace>\"\n        suffix = Path(path).suffix.lower()\n        language = _EXTENSIONS.get(suffix, Language.UNKNOWN)\n        kind = _KINDS.get(str(data.get(\"type\", \"\")).lower(), SymbolKind.CODE_CHUNK)\n        name = str(data.get(\"name\") or raw.split(\":\")[-1])\n        sid = stable_hash([repo_id, raw], \"sym\")\n        node_ids[raw] = sid\n        line = max(1, int(data.get(\"line_no\") or 1))\n        code = str(data.get(\"code\") or \"\")\n        doc = str(data.get(\"docstring\") or \"\")\n        symbols[sid] = Symbol(\n            id=sid, repository_id=repo_id, commit_id=commit, language=language,\n            kind=kind, name=name, qualified_name=raw, file_path=path,\n            start_line=line, start_column=0, end_line=line, end_column=0,\n            source_text=code or doc or None,\n            metadata={\"graft_id\": raw, \"layer\": str(data.get(\"layer\") or \"Lsyn\"),\n                      \"graft_type\": str(data.get(\"type\") or \"\"),\n                      \"repo\": str(data.get(\"repo\") or \"\"), \"docstring\": doc,\n                      \"graft_properties\": _plain(dict(data))},\n            provenance=Provenance.STATIC_ANALYSIS,\n        )\n        repo_name, _, repo_path = path.partition(\"/\")\n        local = ((source_roots or {}).get(repo_name, root / repo_name) / repo_path\n                 if source_roots and repo_name in source_roots else root / path)\n        if path != \"<workspace>\" and suffix in _EXTENSIONS and local.is_file():\n            files[path] = FileNode(\n                id=file_id(repo_id, commit, path), repository_id=repo_id,\n                commit_id=commit, normalized_path=path, language=language,\n                hash=file_sha256(local),\n            )\n\n    relations: dict[str, Relation] = {}\n    for source, target, key, data in graph.edges(keys=True, data=True):\n        relation_name = str(data.get(\"relation\") or \"REFERENCES\")\n        try:\n            relation_type = RelationType(relation_name)\n        except ValueError:\n            relation_type = RelationType.REFERENCES\n        source_id = node_ids[str(source)]\n        target_id = node_ids[str(target)]\n        rid = relation_id(repo_id, commit, source_id, target_id, relation_type, str(key))\n        confidence = float(data.get(\"c_type\", 1.0) or 0.0)\n        relations[rid] = Relation(\n            id=rid, repository_id=repo_id, commit_id=commit,\n            source_symbol_id=source_id, target_symbol_id=target_id,\n            relation_type=relation_type, confidence=max(0.0, min(1.0, confidence)),\n            provenance=Provenance.STATIC_ANALYSIS if relation_type != RelationType.SEMANTIC_SIMILAR\n            else Provenance.HEURISTIC,\n            metadata={\"layer\": str(data.get(\"layer\") or \"\"), \"graft_relation\": relation_name,\n                      \"graft_edge_key\": str(key), \"hyperedge\": _plain(data.get(\"metadata\") or {}),\n                      \"f_call\": _plain(data.get(\"f_call\")),\n                      \"id_ctx\": _plain(data.get(\"id_ctx\")),\n                      \"graft_properties\": _plain(dict(data))},\n        )\n    return LNIRDocument(repository=repository, files=list(files.values()),\n                        symbols=list(symbols.values()), relations=list(relations.values()))","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_aaae7b9eb3ebec40ef20bde7961b9627","label":"__init__.py","qualifiedName":"file::src/sckg/graph/__init__.py","kind":"file","file":"src/sckg/graph/__init__.py","line":1,"sourceText":"# File: src/sckg/graph/__init__.py\n# Lines: 1","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_d02ecd352d89e96b9222d833ff740ef3","label":"builder.py","qualifiedName":"file::src/sckg/graph/builder.py","kind":"file","file":"src/sckg/graph/builder.py","line":1,"sourceText":"# File: src/sckg/graph/builder.py\n# Lines: 30","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_b5f13473d35e7d7f3f9811838e7ce87a","label":"GraphBuildReport","qualifiedName":"src/sckg/graph/builder.py:GraphBuildReport","kind":"class","file":"src/sckg/graph/builder.py","line":11,"sourceText":"class GraphBuildReport:\n    repositories: int\n    files: int\n    symbols: int\n    relations: int","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_265075c82e30425a81d8251c9b2e13f2","label":"GraphBuilder","qualifiedName":"src/sckg/graph/builder.py:GraphBuilder","kind":"class","file":"src/sckg/graph/builder.py","line":18,"sourceText":"class GraphBuilder:\n    def __init__(self, store: GraphStore) -> None:\n        self.store = store\n\n    def build(self, document: LNIRDocument) -> GraphBuildReport:\n        validate_unique_ids(document)\n        upsert_document(self.store, document)\n        return GraphBuildReport(\n            repositories=1,\n            files=len(document.files),\n            symbols=len(document.symbols),\n            relations=len(document.relations),\n        )","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_3f79cce5e0e546159d8e1106fadab62b","label":"__init__","qualifiedName":"src/sckg/graph/builder.py:GraphBuilder.__init__","kind":"function","file":"src/sckg/graph/builder.py","line":19,"sourceText":"    def __init__(self, store: GraphStore) -> None:\n        self.store = store","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_c59561a03d9b399bd4fb1acb8eb1615f","label":"build","qualifiedName":"src/sckg/graph/builder.py:GraphBuilder.build","kind":"function","file":"src/sckg/graph/builder.py","line":22,"sourceText":"    def build(self, document: LNIRDocument) -> GraphBuildReport:\n        validate_unique_ids(document)\n        upsert_document(self.store, document)\n        return GraphBuildReport(\n            repositories=1,\n            files=len(document.files),\n            symbols=len(document.symbols),\n            relations=len(document.relations),\n        )","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_e8c900d872d3555acfbaa649a193d2c5","label":"json_store.py","qualifiedName":"file::src/sckg/graph/json_store.py","kind":"file","file":"src/sckg/graph/json_store.py","line":1,"sourceText":"# File: src/sckg/graph/json_store.py\n# Lines: 209","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_8b8ec6a32db7e670fd04bcb3049edf0a","label":"JsonGraphStore","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore","kind":"class","file":"src/sckg/graph/json_store.py","line":13,"sourceText":"class JsonGraphStore(GraphStore):\n    def __init__(self, path: Path) -> None:\n        self.path = path\n        self.repositories: dict[str, RepositoryNode] = {}\n        self.files: dict[str, FileNode] = {}\n        self.symbols: dict[str, Symbol] = {}\n        self.relations: dict[str, Relation] = {}\n        self._load()\n\n    def _load(self) -> None:\n        if not self.path.exists():\n            return\n        data = json.loads(self.path.read_text(encoding=\"utf-8\"))\n        self.repositories = {\n            item[\"id\"]: RepositoryNode.model_validate(item) for item in data.get(\"repositories\", [])\n        }\n        self.files = {item[\"id\"]: FileNode.model_validate(item) for item in data.get(\"files\", [])}\n        self.symbols = {item[\"id\"]: Symbol.model_validate(item) for item in data.get(\"symbols\", [])}\n        self.relations = {\n            item[\"id\"]: Relation.model_validate(item) for item in data.get(\"relations\", [])\n        }\n\n    def _save(self) -> None:\n        self.path.parent.mkdir(parents=True, exist_ok=True)\n        payload: dict[str, Any] = {\n            \"repositories\": [item.model_dump(mode=\"json\") for item in self.repositories.values()],\n            \"files\": [item.model_dump(mode=\"json\") for item in self.files.values()],\n            \"symbols\": [item.model_dump(mode=\"json\") for item in self.symbols.values()],\n            \"relations\": [item.model_dump(mode=\"json\") for item in self.relations.values()],\n        }\n        self.path.write_text(json.dumps(payload, indent=2), encoding=\"utf-8\")\n\n    def upsert_repository(self, repository: RepositoryNode) -> None:\n        self.repositories[repository.id] = repository\n        self._save()\n\n    def upsert_file(self, file: FileNode) -> None:\n        self.files[file.id] = file\n        self._save()\n\n    def upsert_symbol(self, symbol: Symbol) -> None:\n        self.symbols[symbol.id] = symbol\n        self._save()\n\n    def upsert_relation(self, relation: Relation) -> None:\n        self.relations[relation.id] = relation\n        self._save()\n\n    def replace_document(self, document: LNIRDocument) -> None:\n        repo_id = document.repository.id\n        commit_id = document.repository.commit_id\n        self.repositories[repo_id] = document.repository\n        self.files = {\n            key: value\n            for key, value in self.files.items()\n            if not (value.repository_id == repo_id and value.commit_id == commit_id)\n        }\n        self.symbols = {\n            key: value\n            for key, value in self.symbols.items()\n            if not (value.repository_id == repo_id and value.commit_id == commit_id)\n        }\n        self.relations = {\n            key: value\n            for key, value in self.relations.items()\n            if not (value.repository_id == repo_id and value.commit_id == commit_id)\n        }\n        self.files.update({file.id: file for file in document.files})\n        self.symbols.update({symbol.id: symbol for symbol in document.symbols})\n        self.relations.update({relation.id: relation for relation in document.relations})\n        self._save()\n\n    def find_symbol(self, query: str, limit: int = 20) -> list[Symbol]:\n        query_lower = query.lower()\n        scored = []\n        for symbol in self.symbols.values():\n            haystack = f\"{symbol.qualified_name} {symbol.name} {symbol.file_path}\".lower()\n            if query_lower in haystack:\n                scored.append((0 if symbol.qualified_name.lower() == query_lower else 1, symbol))\n        return [symbol for _, symbol in sorted(scored, key=lambda item: (item[0], item[1].qualified_name))[:limit]]\n\n    def get_symbol(self, symbol: str) -> Symbol | None:\n        if symbol in self.symbols:\n            return self.symbols[symbol]\n        matches = self.find_symbol(symbol, limit=1)\n        return matches[0] if matches else None\n\n    def get_neighbors(\n        self, symbol: str, relation_types: list[RelationType] | None = None, depth: int = 1\n    ) -> tuple[list[Symbol], list[Relation]]:\n        start = self.get_symbol(symbol)\n        if start is None:\n            return [], []\n        allowed = set(relation_types) if relation_types else None\n        seen = {start.id}\n        queue: deque[tuple[str, int]] = deque([(start.id, 0)])\n        relation_hits: dict[str, Relation] = {}\n        while queue:\n            current, distance = queue.popleft()\n            if distance >= depth:\n                continue\n            for relation in self.relations.values():\n                if allowed and relation.relation_type not in allowed:\n                    continue\n                if relation.source_symbol_id == current:\n                    neighbor = relation.target_symbol_id\n                elif relation.target_symbol_id == current:\n                    neighbor = relation.source_symbol_id\n                else:\n                    continue\n                relation_hits[relation.id] = relation\n                if neighbor not in seen:\n                    seen.add(neighbor)\n                    queue.append((neighbor, distance + 1))\n        return [self.symbols[item] for item in seen if item in self.symbols], list(relation_hits.values())\n\n    def get_callers(self, symbol: str) -> list[Symbol]:\n        target = self.get_symbol(symbol)\n        if target is None:\n            return []\n        return [\n            self.symbols[relation.source_symbol_id]\n            for relation in self.relations.values()\n            if relation.relation_type == RelationType.CALLS\n            and relation.target_symbol_id == target.id\n            and relation.source_symbol_id in self.symbols\n        ]\n\n    def get_callees(self, symbol: str) -> list[Symbol]:\n        source = self.get_symbol(symbol)\n        if source is None:\n            return []\n        return [\n            self.symbols[relation.target_symbol_id]\n            for relation in self.relations.values()\n            if relation.relation_type == RelationType.CALLS\n            and relation.source_symbol_id == source.id\n            and relation.target_symbol_id in self.symbols\n        ]\n\n    def get_references(self, symbol: str) -> list[Symbol]:\n        target = self.get_symbol(symbol)\n        if target is None:\n            return []\n        return [\n            self.symbols[relation.source_symbol_id]\n            for relation in self.relations.values()\n            if relation.relation_type == RelationType.REFERENCES\n            and relation.target_symbol_id == target.id\n            and relation.source_symbol_id in self.symbols\n        ]\n\n    def get_definition(self, symbol: str) -> Symbol | None:\n        return self.get_symbol(symbol)\n\n    def get_file_symbols(self, path: str) -> list[Symbol]:\n        return [symbol for symbol in self.symbols.values() if symbol.file_path == path]\n\n    def get_subgraph(\n        self, seeds: list[str], relations: list[RelationType] | None = None, depth: int = 1\n    ) -> tuple[list[Symbol], list[Relation]]:\n        symbols: dict[str, Symbol] = {}\n        edges: dict[str, Relation] = {}\n        for seed in seeds:\n            hits, rels = self.get_neighbors(seed, relations, depth)\n            symbols.update({symbol.id: symbol for symbol in hits})\n            edges.update({relation.id: relation for relation in rels})\n        return list(symbols.values()), list(edges.values())\n\n    def explain_path(self, source: str, target: str, max_depth: int = 4) -> list[Relation]:\n        source_symbol = self.get_symbol(source)\n        target_symbol = self.get_symbol(target)\n        if source_symbol is None or target_symbol is None:\n            return []\n        queue: deque[tuple[str, list[Relation]]] = deque([(source_symbol.id, [])])\n        seen = {source_symbol.id}\n        while queue:\n            current, path = queue.popleft()\n            if len(path) >= max_depth:\n                continue\n            for relation in self.relations.values():\n                if relation.source_symbol_id != current:\n                    continue\n                if relation.target_symbol_id == target_symbol.id:\n                    return [*path, relation]\n                if relation.target_symbol_id not in seen:\n                    seen.add(relation.target_symbol_id)\n                    queue.append((relation.target_symbol_id, [*path, relation]))\n        return []\n\n    def stats(self) -> dict[str, int]:\n        return {\n            \"repositories\": len(self.repositories),\n            \"files\": len(self.files),\n            \"symbols\": len(self.symbols),\n            \"relations\": len(self.relations),\n        }","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_53734a57407e51572afff512bab9df14","label":"__init__","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.__init__","kind":"function","file":"src/sckg/graph/json_store.py","line":14,"sourceText":"    def __init__(self, path: Path) -> None:\n        self.path = path\n        self.repositories: dict[str, RepositoryNode] = {}\n        self.files: dict[str, FileNode] = {}\n        self.symbols: dict[str, Symbol] = {}\n        self.relations: dict[str, Relation] = {}\n        self._load()","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_7b2ee97513e9c866a5a8b96f1e5cda0e","label":"_load","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore._load","kind":"function","file":"src/sckg/graph/json_store.py","line":22,"sourceText":"    def _load(self) -> None:\n        if not self.path.exists():\n            return\n        data = json.loads(self.path.read_text(encoding=\"utf-8\"))\n        self.repositories = {\n            item[\"id\"]: RepositoryNode.model_validate(item) for item in data.get(\"repositories\", [])\n        }\n        self.files = {item[\"id\"]: FileNode.model_validate(item) for item in data.get(\"files\", [])}\n        self.symbols = {item[\"id\"]: Symbol.model_validate(item) for item in data.get(\"symbols\", [])}\n        self.relations = {\n            item[\"id\"]: Relation.model_validate(item) for item in data.get(\"relations\", [])\n        }","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_4c81c5fd29484e338907173c6bd1cc88","label":"_save","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore._save","kind":"function","file":"src/sckg/graph/json_store.py","line":35,"sourceText":"    def _save(self) -> None:\n        self.path.parent.mkdir(parents=True, exist_ok=True)\n        payload: dict[str, Any] = {\n            \"repositories\": [item.model_dump(mode=\"json\") for item in self.repositories.values()],\n            \"files\": [item.model_dump(mode=\"json\") for item in self.files.values()],\n            \"symbols\": [item.model_dump(mode=\"json\") for item in self.symbols.values()],\n            \"relations\": [item.model_dump(mode=\"json\") for item in self.relations.values()],\n        }\n        self.path.write_text(json.dumps(payload, indent=2), encoding=\"utf-8\")","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_6d4e9af007d59d935acfd32e8a664799","label":"upsert_repository","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.upsert_repository","kind":"function","file":"src/sckg/graph/json_store.py","line":45,"sourceText":"    def upsert_repository(self, repository: RepositoryNode) -> None:\n        self.repositories[repository.id] = repository\n        self._save()","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_4ee859abb8abe454933378b0b58e5219","label":"upsert_file","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.upsert_file","kind":"function","file":"src/sckg/graph/json_store.py","line":49,"sourceText":"    def upsert_file(self, file: FileNode) -> None:\n        self.files[file.id] = file\n        self._save()","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_4b59557fb7fdeaac0fe288c2d3162d72","label":"upsert_symbol","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.upsert_symbol","kind":"function","file":"src/sckg/graph/json_store.py","line":53,"sourceText":"    def upsert_symbol(self, symbol: Symbol) -> None:\n        self.symbols[symbol.id] = symbol\n        self._save()","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_e794c4e15cccd66313f85dbb10824866","label":"upsert_relation","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.upsert_relation","kind":"function","file":"src/sckg/graph/json_store.py","line":57,"sourceText":"    def upsert_relation(self, relation: Relation) -> None:\n        self.relations[relation.id] = relation\n        self._save()","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_5e1cef19f5d9fdd89f490717245258d1","label":"replace_document","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.replace_document","kind":"function","file":"src/sckg/graph/json_store.py","line":61,"sourceText":"    def replace_document(self, document: LNIRDocument) -> None:\n        repo_id = document.repository.id\n        commit_id = document.repository.commit_id\n        self.repositories[repo_id] = document.repository\n        self.files = {\n            key: value\n            for key, value in self.files.items()\n            if not (value.repository_id == repo_id and value.commit_id == commit_id)\n        }\n        self.symbols = {\n            key: value\n            for key, value in self.symbols.items()\n            if not (value.repository_id == repo_id and value.commit_id == commit_id)\n        }\n        self.relations = {\n            key: value\n            for key, value in self.relations.items()\n            if not (value.repository_id == repo_id and value.commit_id == commit_id)\n        }\n        self.files.update({file.id: file for file in document.files})\n        self.symbols.update({symbol.id: symbol for symbol in document.symbols})\n        self.relations.update({relation.id: relation for relation in document.relations})\n        self._save()","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_4d80f2a2bfbc8a8c2dc84c24cce83f8c","label":"find_symbol","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.find_symbol","kind":"function","file":"src/sckg/graph/json_store.py","line":85,"sourceText":"    def find_symbol(self, query: str, limit: int = 20) -> list[Symbol]:\n        query_lower = query.lower()\n        scored = []\n        for symbol in self.symbols.values():\n            haystack = f\"{symbol.qualified_name} {symbol.name} {symbol.file_path}\".lower()\n            if query_lower in haystack:\n                scored.append((0 if symbol.qualified_name.lower() == query_lower else 1, symbol))\n        return [symbol for _, symbol in sorted(scored, key=lambda item: (item[0], item[1].qualified_name))[:limit]]","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_c9f7dfd84ffc49f845d224b39cd19b3e","label":"get_symbol","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.get_symbol","kind":"function","file":"src/sckg/graph/json_store.py","line":94,"sourceText":"    def get_symbol(self, symbol: str) -> Symbol | None:\n        if symbol in self.symbols:\n            return self.symbols[symbol]\n        matches = self.find_symbol(symbol, limit=1)\n        return matches[0] if matches else None","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_02a45e5099dba86f5de857f82eb1f80f","label":"get_neighbors","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.get_neighbors","kind":"function","file":"src/sckg/graph/json_store.py","line":100,"sourceText":"    def get_neighbors(\n        self, symbol: str, relation_types: list[RelationType] | None = None, depth: int = 1\n    ) -> tuple[list[Symbol], list[Relation]]:\n        start = self.get_symbol(symbol)\n        if start is None:\n            return [], []\n        allowed = set(relation_types) if relation_types else None\n        seen = {start.id}\n        queue: deque[tuple[str, int]] = deque([(start.id, 0)])\n        relation_hits: dict[str, Relation] = {}\n        while queue:\n            current, distance = queue.popleft()\n            if distance >= depth:\n                continue\n            for relation in self.relations.values():\n                if allowed and relation.relation_type not in allowed:\n                    continue\n                if relation.source_symbol_id == current:\n                    neighbor = relation.target_symbol_id\n                elif relation.target_symbol_id == current:\n                    neighbor = relation.source_symbol_id\n                else:\n                    continue\n                relation_hits[relation.id] = relation\n                if neighbor not in seen:\n                    seen.add(neighbor)\n                    queue.append((neighbor, distance + 1))\n        return [self.symbols[item] for item in seen if item in self.symbols], list(relation_hits.values())","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_18bd4dc39ada65e06b4fe44f11c7dfda","label":"get_callers","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.get_callers","kind":"function","file":"src/sckg/graph/json_store.py","line":129,"sourceText":"    def get_callers(self, symbol: str) -> list[Symbol]:\n        target = self.get_symbol(symbol)\n        if target is None:\n            return []\n        return [\n            self.symbols[relation.source_symbol_id]\n            for relation in self.relations.values()\n            if relation.relation_type == RelationType.CALLS\n            and relation.target_symbol_id == target.id\n            and relation.source_symbol_id in self.symbols\n        ]","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_36570c308bd9b2fabc937cde7058b1df","label":"get_callees","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.get_callees","kind":"function","file":"src/sckg/graph/json_store.py","line":141,"sourceText":"    def get_callees(self, symbol: str) -> list[Symbol]:\n        source = self.get_symbol(symbol)\n        if source is None:\n            return []\n        return [\n            self.symbols[relation.target_symbol_id]\n            for relation in self.relations.values()\n            if relation.relation_type == RelationType.CALLS\n            and relation.source_symbol_id == source.id\n            and relation.target_symbol_id in self.symbols\n        ]","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_b23d926238380178051311f03042e0d1","label":"get_references","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.get_references","kind":"function","file":"src/sckg/graph/json_store.py","line":153,"sourceText":"    def get_references(self, symbol: str) -> list[Symbol]:\n        target = self.get_symbol(symbol)\n        if target is None:\n            return []\n        return [\n            self.symbols[relation.source_symbol_id]\n            for relation in self.relations.values()\n            if relation.relation_type == RelationType.REFERENCES\n            and relation.target_symbol_id == target.id\n            and relation.source_symbol_id in self.symbols\n        ]","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_640a0d6e2c2dc9284d98ff7f31c4b53d","label":"get_definition","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.get_definition","kind":"function","file":"src/sckg/graph/json_store.py","line":165,"sourceText":"    def get_definition(self, symbol: str) -> Symbol | None:\n        return self.get_symbol(symbol)","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_591ca2cd3659943c1208c00bd7501fb8","label":"get_file_symbols","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.get_file_symbols","kind":"function","file":"src/sckg/graph/json_store.py","line":168,"sourceText":"    def get_file_symbols(self, path: str) -> list[Symbol]:\n        return [symbol for symbol in self.symbols.values() if symbol.file_path == path]","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_b8764c56bf7e77407a4aea6f80cf5ea7","label":"get_subgraph","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.get_subgraph","kind":"function","file":"src/sckg/graph/json_store.py","line":171,"sourceText":"    def get_subgraph(\n        self, seeds: list[str], relations: list[RelationType] | None = None, depth: int = 1\n    ) -> tuple[list[Symbol], list[Relation]]:\n        symbols: dict[str, Symbol] = {}\n        edges: dict[str, Relation] = {}\n        for seed in seeds:\n            hits, rels = self.get_neighbors(seed, relations, depth)\n            symbols.update({symbol.id: symbol for symbol in hits})\n            edges.update({relation.id: relation for relation in rels})\n        return list(symbols.values()), list(edges.values())","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_37d5d03abddfd6fc04263e40450b8efb","label":"explain_path","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.explain_path","kind":"function","file":"src/sckg/graph/json_store.py","line":182,"sourceText":"    def explain_path(self, source: str, target: str, max_depth: int = 4) -> list[Relation]:\n        source_symbol = self.get_symbol(source)\n        target_symbol = self.get_symbol(target)\n        if source_symbol is None or target_symbol is None:\n            return []\n        queue: deque[tuple[str, list[Relation]]] = deque([(source_symbol.id, [])])\n        seen = {source_symbol.id}\n        while queue:\n            current, path = queue.popleft()\n            if len(path) >= max_depth:\n                continue\n            for relation in self.relations.values():\n                if relation.source_symbol_id != current:\n                    continue\n                if relation.target_symbol_id == target_symbol.id:\n                    return [*path, relation]\n                if relation.target_symbol_id not in seen:\n                    seen.add(relation.target_symbol_id)\n                    queue.append((relation.target_symbol_id, [*path, relation]))\n        return []","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_429d3a1493ce724792fbc451fd6f7267","label":"stats","qualifiedName":"src/sckg/graph/json_store.py:JsonGraphStore.stats","kind":"function","file":"src/sckg/graph/json_store.py","line":203,"sourceText":"    def stats(self) -> dict[str, int]:\n        return {\n            \"repositories\": len(self.repositories),\n            \"files\": len(self.files),\n            \"symbols\": len(self.symbols),\n            \"relations\": len(self.relations),\n        }","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_0da5a3112f93bedc834f300347410269","label":"neo4j_store.py","qualifiedName":"file::src/sckg/graph/neo4j_store.py","kind":"file","file":"src/sckg/graph/neo4j_store.py","line":1,"sourceText":"# File: src/sckg/graph/neo4j_store.py\n# Lines: 218","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_71e176ffffbdfb318f5219408176ff10","label":"Neo4jGraphStore","qualifiedName":"src/sckg/graph/neo4j_store.py:Neo4jGraphStore","kind":"class","file":"src/sckg/graph/neo4j_store.py","line":12,"sourceText":"class Neo4jGraphStore(GraphStore):\n    def __init__(self, uri: str, user: str, password: str) -> None:\n        self.driver: Driver = GraphDatabase.driver(uri, auth=(user, password))\n        self.ensure_schema()\n\n    def close(self) -> None:\n        self.driver.close()\n\n    def ensure_schema(self) -> None:\n        statements = [\n            \"CREATE CONSTRAINT repository_id IF NOT EXISTS FOR (r:Repository) REQUIRE r.id IS UNIQUE\",\n            \"CREATE CONSTRAINT file_id IF NOT EXISTS FOR (f:File) REQUIRE f.id IS UNIQUE\",\n            \"CREATE CONSTRAINT symbol_id IF NOT EXISTS FOR (s:Symbol) REQUIRE s.id IS UNIQUE\",\n            \"CREATE INDEX symbol_qn IF NOT EXISTS FOR (s:Symbol) ON (s.qualified_name)\",\n            \"CREATE INDEX symbol_commit IF NOT EXISTS FOR (s:Symbol) ON (s.commit_id)\",\n            \"CREATE INDEX file_path IF NOT EXISTS FOR (f:File) ON (f.normalized_path)\",\n            \"CREATE INDEX repo_commit IF NOT EXISTS FOR (r:Repository) ON (r.commit_id)\",\n        ]\n        with self.driver.session() as session:\n            for statement in statements:\n                session.run(statement)\n\n    def upsert_repository(self, repository: RepositoryNode) -> None:\n        self._batch_nodes(\"Repository\", [repository.model_dump(mode=\"json\")])\n\n    def upsert_file(self, file: FileNode) -> None:\n        self._batch_nodes(\"File\", [file.model_dump(mode=\"json\")])\n\n    def upsert_symbol(self, symbol: Symbol) -> None:\n        self._batch_nodes(\"Symbol\", [symbol.model_dump(mode=\"json\")])\n\n    def upsert_symbols(self, symbols: list[Symbol]) -> None:\n        self._batch_nodes(\"Symbol\", [symbol.model_dump(mode=\"json\") for symbol in symbols])\n\n    def upsert_relation(self, relation: Relation) -> None:\n        self.upsert_relations([relation])\n\n    def upsert_relations(self, relations: list[Relation]) -> None:\n        grouped: dict[str, list[dict[str, object]]] = {}\n        for relation in relations:\n            grouped.setdefault(relation.relation_type.value, []).append(relation.model_dump(mode=\"json\"))\n        with self.driver.session() as session:\n            for rel_type, rows in grouped.items():\n                session.run(\n                    f\"\"\"\n                    UNWIND $rows AS row\n                    MATCH (source:Symbol {{id: row.source_symbol_id}})\n                    MATCH (target:Symbol {{id: row.target_symbol_id}})\n                    MERGE (source)-[r:{rel_type} {{id: row.id}}]->(target)\n                    SET r += row\n                    \"\"\",\n                    rows=rows,\n                )\n\n    def _batch_nodes(self, label: str, rows: Iterable[dict[str, object]]) -> None:\n        with self.driver.session() as session:\n            session.run(\n                f\"\"\"\n                UNWIND $rows AS row\n                MERGE (n:{label} {{id: row.id}})\n                SET n += row\n                \"\"\",\n                rows=list(rows),\n            )\n\n    def find_symbol(self, query: str, limit: int = 20) -> list[Symbol]:\n        with self.driver.session() as session:\n            records = session.run(\n                \"\"\"\n                MATCH (s:Symbol)\n                WHERE toLower(s.qualified_name) CONTAINS toLower($query)\n                   OR toLower(s.name) CONTAINS toLower($query)\n                RETURN properties(s) AS s\n                ORDER BY s.qualified_name\n                LIMIT $limit\n                \"\"\",\n                query=query,\n                limit=limit,\n            )\n            return [Symbol.model_validate(record[\"s\"]) for record in records]\n\n    def get_symbol(self, symbol: str) -> Symbol | None:\n        with self.driver.session() as session:\n            record = session.run(\n                \"\"\"\n                MATCH (s:Symbol)\n                WHERE s.id = $symbol OR s.qualified_name = $symbol\n                RETURN properties(s) AS s\n                LIMIT 1\n                \"\"\",\n                symbol=symbol,\n            ).single()\n            if record:\n                return Symbol.model_validate(record[\"s\"])\n        matches = self.find_symbol(symbol, 1)\n        return matches[0] if matches else None\n\n    def get_neighbors(\n        self, symbol: str, relation_types: list[RelationType] | None = None, depth: int = 1\n    ) -> tuple[list[Symbol], list[Relation]]:\n        start = self.get_symbol(symbol)\n        if start is None:\n            return [], []\n        rel_filter = [rel.value for rel in relation_types] if relation_types else None\n        with self.driver.session() as session:\n            records = session.run(\n                \"\"\"\n                MATCH path=(s:Symbol {id: $id})-[rels*1..$depth]-(n:Symbol)\n                WHERE $rel_filter IS NULL OR all(r IN rels WHERE type(r) IN $rel_filter)\n                UNWIND nodes(path) AS node\n                WITH collect(DISTINCT properties(node)) AS nodes, collect(rels) AS rel_groups\n                UNWIND rel_groups AS group\n                UNWIND group AS rel\n                RETURN nodes, collect(DISTINCT properties(rel)) AS rels\n                \"\"\",\n                id=start.id,\n                depth=depth,\n                rel_filter=rel_filter,\n            ).single()\n            if not records:\n                return [start], []\n            return (\n                [Symbol.model_validate(row) for row in records[\"nodes\"]],\n                [Relation.model_validate(row) for row in records[\"rels\"]],\n            )\n\n    def get_callers(self, symbol: str) -> list[Symbol]:\n        return self._incoming(symbol, RelationType.CALLS)\n\n    def get_callees(self, symbol: str) -> list[Symbol]:\n        return self._outgoing(symbol, RelationType.CALLS)\n\n    def get_references(self, symbol: str) -> list[Symbol]:\n        return self._incoming(symbol, RelationType.REFERENCES)\n\n    def get_definition(self, symbol: str) -> Symbol | None:\n        return self.get_symbol(symbol)\n\n    def get_file_symbols(self, path: str) -> list[Symbol]:\n        with self.driver.session() as session:\n            records = session.run(\n                \"MATCH (s:Symbol {file_path: $path}) RETURN properties(s) AS s ORDER BY s.start_line\",\n                path=path,\n            )\n            return [Symbol.model_validate(record[\"s\"]) for record in records]\n\n    def get_subgraph(\n        self, seeds: list[str], relations: list[RelationType] | None = None, depth: int = 1\n    ) -> tuple[list[Symbol], list[Relation]]:\n        symbols: dict[str, Symbol] = {}\n        rels: dict[str, Relation] = {}\n        for seed in seeds:\n            nodes, edges = self.get_neighbors(seed, relations, depth)\n            symbols.update({node.id: node for node in nodes})\n            rels.update({edge.id: edge for edge in edges})\n        return list(symbols.values()), list(rels.values())\n\n    def explain_path(self, source: str, target: str, max_depth: int = 4) -> list[Relation]:\n        source_symbol = self.get_symbol(source)\n        target_symbol = self.get_symbol(target)\n        if source_symbol is None or target_symbol is None:\n            return []\n        with self.driver.session() as session:\n            record = session.run(\n                \"\"\"\n                MATCH path=shortestPath((s:Symbol {id: $source})-[*1..$depth]->(t:Symbol {id: $target}))\n                RETURN [r IN relationships(path) | properties(r)] AS rels\n                \"\"\",\n                source=source_symbol.id,\n                target=target_symbol.id,\n                depth=max_depth,\n            ).single()\n            return [Relation.model_validate(row) for row in record[\"rels\"]] if record else []\n\n    def stats(self) -> dict[str, int]:\n        with self.driver.session() as session:\n            record = session.run(\n                \"\"\"\n                MATCH (n)\n                WITH count(n) AS nodes\n                MATCH ()-[r]->()\n                RETURN nodes, count(r) AS relations\n                \"\"\"\n            ).single()\n            return {\"nodes\": record[\"nodes\"], \"relations\": record[\"relations\"]} if record else {}\n\n    def _incoming(self, symbol: str, relation_type: RelationType) -> list[Symbol]:\n        target = self.get_symbol(symbol)\n        if target is None:\n            return []\n        with self.driver.session() as session:\n            records = session.run(\n                f\"MATCH (s:Symbol)-[:{relation_type.value}]->(:Symbol {{id: $id}}) RETURN properties(s) AS s\",\n                id=target.id,\n            )\n            return [Symbol.model_validate(record[\"s\"]) for record in records]\n\n    def _outgoing(self, symbol: str, relation_type: RelationType) -> list[Symbol]:\n        source = self.get_symbol(symbol)\n        if source is None:\n            return []\n        with self.driver.session() as session:\n            records = session.run(\n                f\"MATCH (:Symbol {{id: $id}})-[:{relation_type.value}]->(s:Symbol) RETURN properties(s) AS s\",\n  with self.driver.session() as session:\n            session.run(\n                f\"\"\"\n                UNWIND $rows AS row\n                MERGE (n:{label} {{id: row.id}})\n                SET n += row\n                \"\"\",\n                rows=list(rows),\n            )","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_6ced76c30d1c6ab704875eb3a075ef04","label":"find_symbol","qualifiedName":"src/sckg/graph/neo4j_store.py:Neo4jGraphStore.find_symbol","kind":"function","file":"src/sckg/graph/neo4j_store.py","line":77,"sourceText":"    def find_symbol(self, query: str, limit: int = 20) -> list[Symbol]:\n        with self.driver.session() as session:\n            records = session.run(\n                \"\"\"\n                MATCH (s:Symbol)\n                WHERE toLower(s.qualified_name) CONTAINS toLower($query)\n                   OR toLower(s.name) CONTAINS toLower($query)\n                RETURN properties(s) AS s\n                ORDER BY s.qualified_name\n                LIMIT $limit\n                \"\"\",\n                query=query,\n                limit=limit,\n            )\n            return [Symbol.model_validate(record[\"s\"]) for record in records]","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_bcf6208dfede0f9f6cb24f29cee34b06","label":"get_symbol","qualifiedName":"src/sckg/graph/neo4j_store.py:Neo4jGraphStore.get_symbol","kind":"function","file":"src/sckg/graph/neo4j_store.py","line":93,"sourceText":"    def get_symbol(self, symbol: str) -> Symbol | None:\n        with self.driver.session() as session:\n            record = session.run(\n                \"\"\"\n                MATCH (s:Symbol)\n                WHERE s.id = $symbol OR s.qualified_name = $symbol\n                RETURN properties(s) AS s\n                LIMIT 1\n                \"\"\",\n                symbol=symbol,\n            ).single()\n            if record:\n                return Symbol.model_validate(record[\"s\"])\n        matches = self.find_symbol(symbol, 1)\n        return matches[0] if matches else None","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_b63b78f0df9e3b28f244f00f99fe5169","label":"get_neighbors","qualifiedName":"src/sckg/graph/neo4j_store.py:Neo4jGraphStore.get_neighbors","kind":"function","file":"src/sckg/graph/neo4j_store.py","line":109,"sourceText":"    def get_neighbors(\n        self, symbol: str, relation_types: list[RelationType] | None = None, depth: int = 1\n    ) -> tuple[list[Symbol], list[Relation]]:\n        start = self.get_symbol(symbol)\n        if start is None:\n            return [], []\n        rel_filter = [rel.value for rel in relation_types] if relation_types else None\n        with self.driver.session() as session:\n            records = session.run(\n                \"\"\"\n                MATCH path=(s:Symbol {id: $id})-[rels*1..$depth]-(n:Symbol)\n                WHERE $rel_filter IS NULL OR all(r IN rels WHERE type(r) IN $rel_filter)\n                UNWIND nodes(path) AS node\n                WITH collect(DISTINCT properties(node)) AS nodes, collect(rels) AS rel_groups\n                UNWIND rel_groups AS group\n                UNWIND group AS rel\n                RETURN nodes, collect(DISTINCT properties(rel)) AS rels\n                \"\"\",\n                id=start.id,\n                depth=depth,\n                rel_filter=rel_filter,\n            ).single()\n            if not records:\n                return [start], []\n            return (\n                [Symbol.model_validate(row) for row in records[\"nodes\"]],\n                [Relation.model_validate(row) for row in records[\"rels\"]],\n            )","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_460d571676fd08f3e63f1993fe439f24","label":"get_callers","qualifiedName":"src/sckg/gra xing/ignore.py","line":21,"sourceText":"def should_ignore(path: Path, root: Path, ignore_names: set[str] | None = None) -> bool:\n    ignores = ignore_names or DEFAULT_IGNORES\n    try:\n        relative = path.relative_to(root)\n    except ValueError:\n        return True\n    return any(part in ignores for part in relative.parts)","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_0ac64394bbff0b87f446246954dbb589","label":"manifest.py","qualifiedName":"file::src/sckg/indexing/manifest.py","kind":"file","file":"src/sckg/indexing/manifest.py","line":1,"sourceText":"# File: src/sckg/indexing/manifest.py\n# Lines: 32","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_27cc86ff67e9bc5ead90b927b33679b7","label":"create_manifest","qualifiedName":"src/sckg/indexing/manifest.py:create_manifest","kind":"function","file":"src/sckg/indexing/manifest.py","line":12,"sourceText":"def create_manifest(document: LNIRDocument, config: dict[str, object]) -> IndexManifest:\n    return IndexManifest(\n        repository=document.repository.path,\n        commit_sha=document.repository.commit_id,\n        indexer_version=__version__,\n        schema_version=SCHEMA_VERSION,\n        language_frontends={document.files[0].language.value: __version__} if document.files else {},\n        configuration_hash=configuration_hash(config),\n        files_scanned=len(document.files),\n        files_parsed=len(document.files),\n        files_failed=0,\n        symbols_extracted=len(document.symbols),\n        relations_extracted=len(document.relations),\n        relation_counts=dict(Counter(rel.relation_type.value for rel in document.relations)),\n    )","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_13ee3f62c4f4d13cde808628fc77d746","label":"write_manifest","qualifiedName":"src/sckg/indexing/manifest.py:write_manifest","kind":"function","file":"src/sckg/indexing/manifest.py","line":29,"sourceText":"def write_manifest(document: LNIRDocument, config: dict[str, object], output_dir: Path) -> IndexManifest:\n    manifest = create_manifest(document, config)\n    manifest.write(output_dir / \"manifest.json\")\n    return manifest","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_23865604b2ae84d4577ace5f4c82a1f6","label":"pipeline.py","qualifiedName":"file::src/sckg/indexing/pipeline.py","kind":"file","file":"src/sckg/indexing/pipeline.py","line":1,"sourceText":"# File: src/sckg/indexing/pipeline.py\n# Lines: 74","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_00a4cbcc7c770aa65d61eaced404af18","label":"IndexReport","qualifiedName":"src/sckg/indexing/pipeline.py:IndexReport","kind":"class","file":"src/sckg/indexing/pipeline.py","line":14,"sourceText":"class IndexReport:\n    document: LNIRDocument\n    build: GraphBuildReport\n    manifest: IndexManifest","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_78cff9f9f998657201d3289bc9d33ea1","label":"IndexingPipeline","qualifiedName":"src/sckg/indexing/pipeline.py:IndexingPipeline","kind":"class","file":"src/sckg/indexing/pipeline.py","line":20,"sourceText":"class IndexingPipeline:\n    def __init__(self, store: GraphStore, config: dict[str, object] | None = None) -> None:\n        self.store = store\n        self.config = config or {}\n        self.frontend = PythonFrontend()\n\n    def index(self, repo_path: Path) -> IndexReport:\n        architecture = self.config.get(\"architecture\", \"lnir\")\n        if architecture == \"graft\":\n            from sckg.graft.adapter import graph_to_document\n            try:\n                from sckg.graft.graft_ckg import CKGBuilder\n            except ImportError as exc:\n                raise RuntimeError('GRAFT build needs: pip install -e \".[graft]\"') from exc\n            builder = CKGBuilder(str(repo_path))\n            graph = builder.build()\n            if self.config.get(\"lineage\"):\n                from sckg.graft.lineage import LineageLayer\n                LineageLayer(builder).ingest(max_commits=int(self.config.get(\"max_commits\", 200)))\n            document = graph_to_document(graph, repo_path)\n        elif architecture == \"lnir\":\n            document = self.frontend.index_repository(repo_path)\n        else:\n            raise ValueError(f\"unknown graph architecture: {architecture}\")\n        build = GraphBuilder(self.store).build(document)\n        manifest = create_manifest(document, self.config)\n        return IndexReport(document=document, build=build, manifest=manifest)\n\n    def index_workspace(self, workspace_path: Path) -> IndexReport:\n        from sckg.graft.adapter import graph_to_document\n        try:\n            from sckg.graft.multi_repo import WorkspaceCKGBuilder\n        except ImportError as exc:\n            raise RuntimeError('GRAFT workspace build needs: pip install -e \".[graft]\"') from exc\n        builder = WorkspaceCKGBuilder(str(workspace_path))\n        graph = builder.build()\n        if self.config.get(\"lineage\"):\n            from sckg.graft.lineage import LineageLayer\n            for repo_builder in builder.repo_builders.values():\n                LineageLayer(repo_builder).ingest(max_commits=int(self.config.get(\"max_commits\", 200)))\n                for node, data in repo_builder.graph.nodes(data=True):\n                    if data.get(\"layer\") == \"Llineage\":\n                        graph.add_node(node, **data)\n                for source, target, key, data in repo_builder.graph.edges(keys=True, data=True):\n                    if data.get(\"layer\") == \"Llineage\":\n                        graph.add_edge(source, target, key=f\"lineage_{repo_builder.repo_id}_{key}\",\n                                       **data)\n        source_roots = {repo.id: Path(builder._resolve_path(repo.path))\n                        for repo in builder.config.repositories}\n        document = graph_to_document(graph, workspace_path.parent,\n                                     identity=str(workspace_path.resolve()),\n                                     source_roots=source_roots)\n        build = GraphBuilder(self.store).build(document)\n        manifest = create_manifest(document, {**self.config, \"architecture\": \"graft-workspace\"})\n        return IndexReport(document=document, build=build, manifest=manifest)","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_d341e30e34b811b8db42a92530f7a19f","label":"__init__","qualifiedName":"src/sckg/indexing/pipeline.py:IndexingPipeline.__init__","kind":"function","file":"src/sckg/indexing/pipeline.py","line":21,"sourceText":"    def __init__(self, store: GraphStore, config: dict[str, object] | None = None) -> None:\n        self.store = store\n        self.config = config or {}\n        self.frontend = PythonFrontend()","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_fcca9ba4f6ddea8ddc058968464998c8","label":"index","qualifiedName":"src/sckg/indexing/pipeline.py:IndexingPipeline.index","kind":"function","file":"src/sckg/indexing/pipeline.py","line":26,"sourceText":"    def index(self, repo_path: Path) -> IndexReport:\n        architecture = self.config.get(\"architecture\", \"lnir\")\n        if architecture == \"graft\":\n            from sckg.graft.adapter import graph_to_document\n            try:\n                from sckg.graft.graft_ckg import CKGBuilder\n            except ImportError as exc:\n                raise RuntimeError('GRAFT build needs: pip install -e \".[graft]\"') from exc\n            builder = CKGBuilder(str(repo_path))\n            graph = builder.build()\n            if self.config.get(\"lineage\"):\n                from sckg.graft.lineage
