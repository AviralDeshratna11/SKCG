/retrieval/egpot/models.py","line":150,"sourceText":"class Timer:\n    def __enter__(self) -> Timer:\n        self.start = perf_counter()\n        self.elapsed = 0.0\n        return self\n\n    def __exit__(self, *_: object) -> None:\n        self.elapsed = perf_counter() - self.start","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_5742324494a82ecc5dc795033868072f","label":"__enter__","qualifiedName":"src/sckg/retrieval/egpot/models.py:Timer.__enter__","kind":"function","file":"src/sckg/retrieval/egpot/models.py","line":151,"sourceText":"    def __enter__(self) -> Timer:\n        self.start = perf_counter()\n        self.elapsed = 0.0\n        return self","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_35b30828ebbb113708ffe20954efba21","label":"__exit__","qualifiedName":"src/sckg/retrieval/egpot/models.py:Timer.__exit__","kind":"function","file":"src/sckg/retrieval/egpot/models.py","line":156,"sourceText":"    def __exit__(self, *_: object) -> None:\n        self.elapsed = perf_counter() - self.start","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_c8ccd024cc4e1e0086938d82054f65e7","label":"objectives.py","qualifiedName":"file::src/sckg/retrieval/egpot/objectives.py","kind":"file","file":"src/sckg/retrieval/egpot/objectives.py","line":1,"sourceText":"# File: src/sckg/retrieval/egpot/objectives.py\n# Lines: 149","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_cc9029ebc4e97e8c09dcf049e67118d6","label":"StructuralEntropyEstimator","qualifiedName":"src/sckg/retrieval/egpot/objectives.py:StructuralEntropyEstimator","kind":"class","file":"src/sckg/retrieval/egpot/objectives.py","line":16,"sourceText":"class StructuralEntropyEstimator:\n    def __init__(self, store: GraphStore, hubs: HubSuppressor | None = None) -> None:\n        self.store = store\n        self.hubs = hubs\n        self._cache: dict[str, float] = {}\n\n    def entropy(self, symbol: Symbol) -> float:\n        if symbol.id in self._cache:\n            return self._cache[symbol.id]\n        relations = self._outgoing_relations(symbol)\n        total = len(relations)\n        if total == 0:\n            self._cache[symbol.id] = 0.0\n            return 0.0\n        counts = Counter(relation.relation_type for relation in relations)\n        value = -sum((count / total) * math.log2(count / total) for count in counts.values())\n        if math.isclose(value, 0.0, abs_tol=1e-12):\n            value = 0.0\n        if self.hubs is not None:\n            value *= self.hubs.discount(symbol.id)\n        self._cache[symbol.id] = value\n        return value\n\n    def _outgoing_relations(self, symbol: Symbol) -> list[Relation]:\n        if isinstance(self.store, JsonGraphStore):\n            return [\n                relation\n                for relation in self.store.relations.values()\n                if relation.source_symbol_id == symbol.id and relation.target_symbol_id != symbol.id\n            ]\n        _, relations = self.store.get_neighbors(symbol.id, depth=1)\n        return [relation for relation in relations if relation.source_symbol_id == symbol.id]","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_ce94847d23e5cb0e7d34cd1b65871c4b","label":"__init__","qualifiedName":"src/sckg/retrieval/egpot/objectives.py:StructuralEntropyEstimator.__init__","kind":"function","file":"src/sckg/retrieval/egpot/objectives.py","line":17,"sourceText":"    def __init__(self, store: GraphStore, hubs: HubSuppressor | None = None) -> None:\n        self.store = store\n        self.hubs = hubs\n        self._cache: dict[str, float] = {}","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_12a6c8f4e86496860cef95856eb1cc59","label":"entropy","qualifiedName":"src/sckg/retrieval/egpot/objectives.py:StructuralEntropyEstimator.entropy","kind":"function","file":"src/sckg/retrieval/egpot/objectives.py","line":22,"sourceText":"    def entropy(self, symbol: Symbol) -> float:\n        if symbol.id in self._cache:\n            return self._cache[symbol.id]\n        relations = self._outgoing_relations(symbol)\n        total = len(relations)\n        if total == 0:\n            self._cache[symbol.id] = 0.0\n            return 0.0\n        counts = Counter(relation.relation_type for relation in relations)\n        value = -sum((count / total) * math.log2(count / total) for count in counts.values())\n        if math.isclose(value, 0.0, abs_tol=1e-12):\n            value = 0.0\n        if self.hubs is not None:\n            value *= self.hubs.discount(symbol.id)\n        self._cache[symbol.id] = value\n        return value","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_48c36aca9a1ee95dd64eba8b92b61c16","label":"_outgoing_relations","qualifiedName":"src/sckg/retrieval/egpot/objectives.py:StructuralEntropyEstimator._outgoing_relations","kind":"function","file":"src/sckg/retrieval/egpot/objectives.py","line":39,"sourceText":"    def _outgoing_relations(self, symbol: Symbol) -> list[Relation]:\n        if isinstance(self.store, JsonGraphStore):\n            return [\n                relation\n                for relation in self.store.relations.values()\n                if relation.source_symbol_id == symbol.id and relation.target_symbol_id != symbol.id\n            ]\n        _, relations = self.store.get_neighbors(symbol.id, depth=1)\n        return [relation for relation in relations if relation.source_symbol_id == symbol.id]","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_b25289cb719e53c95f811824b4da9d3c","label":"NoveltyEstimator","qualifiedName":"src/sckg/retrieval/egpot/objectives.py:NoveltyEstimator","kind":"class","file":"src/sckg/retrieval/egpot/objectives.py","line":50,"sourceText":"class NoveltyEstimator:\n    def novelty(self, symbol: Symbol, relation: Relation, trajectory: Trajectory) -> float:\n        if trajectory.creates_cycle(symbol):\n            return 0.0\n        score = 1.0\n        if any(node.file_path == symbol.file_path for node in trajectory.nodes):\n            score *= 0.75\n        if any(node.source_text and node.source_text == symbol.source_text for node in trajectory.nodes):\n            score *= 0.25\n        if any(hop.relation.relation_type == relation.relation_type for hop in trajectory.hops):\n            score *= 0.85\n        return max(0.0, min(1.0, score))","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_8fac7847c493adb5e733e63afd1e0b6b","label":"novelty","qualifiedName":"src/sckg/retrieval/egpot/objectives.py:NoveltyEstimator.novelty","kind":"function","file":"src/sckg/retrieval/egpot/objectives.py","line":51,"sourceText":"    def novelty(self, symbol: Symbol, relation: Relation, trajectory: Trajectory) -> float:\n        if trajectory.creates_cycle(symbol):\n            return 0.0\n        score = 1.0\n        if any(node.file_path == symbol.file_path for node in trajectory.nodes):\n            score *= 0.75\n        if any(node.source_text and node.source_text == symbol.source_text for node in trajectory.nodes):\n            score *= 0.25\n        if any(hop.relation.relation_type == relation.relation_type for hop in trajectory.hops):\n            score *= 0.85\n        return max(0.0, min(1.0, score))","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_18b79683d743bca0fc5acb2d5e3a7818","label":"ContractEvaluator","qualifiedName":"src/sckg/retrieval/egpot/objectives.py:ContractEvaluator","kind":"class","file":"src/sckg/retrieval/egpot/objectives.py","line":64,"sourceText":"class ContractEvaluator:\n    def __init__(self, config: EGPOTConfig) -> None:\n        self.config = config\n\n    def score(self, previous: Symbol, candidate: Symbol, relation: Relation) -> ContractScore:\n        if previous.type and candidate.type and previous.type == candidate.type:\n            return ContractScore(\n                self.config.contract_exact_score,\n                ContractStatus.EXACT,\n                (\"matching symbol types\",),\n                (relation.provenance.value,),\n            )\n        if relation.confidence >= 0.95 and relation.provenance != Provenance.HEURISTIC:\n            return ContractScore(\n                self.config.contract_exact_score,\n                ContractStatus.COMPATIBLE,\n                (\"high-confidence static relation\",),\n                (relation.provenance.value,),\n            )\n        if previous.type is None or candidate.type is None:\n            return ContractScore(\n                self.config.contract_unknown_score,\n                ContractStatus.UNKNOWN,\n                (\"type metadata unavailable\",),\n                (relation.provenance.value,),\n            )\n        return ContractScore(\n            self.config.contract_unknown_score,\n            ContractStatus.INCONSISTENT,\n            (\"available type metadata differs\",),\n            (relation.provenance.value,),\n        )","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_1c6976ac8e18de3edbd0260c12f54278","label":"__init__","qualifiedName":"src/sckg/retrieval/egpot/objectives.py:ContractEvaluator.__init__","kind":"function","file":"src/sckg/retrieval/egpot/objectives.py","line":65,"sourceText":"    def __init__(self, config: EGPOTConfig) -> None:\n        self.config = config","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_d04101a9b6cc6d3f89a325799b8d6337","label":"score","qualifiedName":"src/sckg/retrieval/egpot/objectives.py:ContractEvaluator.score","kind":"function","file":"src/sckg/retrieval/egpot/objectives.py","line":68,"sourceText":"    def score(self, previous: Symbol, candidate: Symbol, relation: Relation) -> ContractScore:\n        if previous.type and candidate.type and previous.type == candidate.type:\n            return ContractScore(\n                self.config.contract_exact_score,\n                ContractStatus.EXACT,\n                (\"matching symbol types\",),\n                (relation.provenance.value,),\n            )\n        if relation.confidence >= 0.95 and relation.provenance != Provenance.HEURISTIC:\n            return ContractScore(\n                self.config.contract_exact_score,\n                ContractStatus.COMPATIBLE,\n                (\"high-confidence static relation\",),\n                (relation.provenance.value,),\n            )\n        if previous.type is None or candidate.type is None:\n            return ContractScore(\n                self.config.contract_unknown_score,\n                ContractStatus.UNKNOWN,\n                (\"type metadata unavailable\",),\n                (relation.provenance.value,),\n            )\n        return ContractScore(\n            self.config.contract_unknown_score,\n            ContractStatus.INCONSISTENT,\n            (\"available type metadata differs\",),\n            (relation.provenance.value,),\n        )","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_a92885bd7e8aafb924a386da9e7a9487","label":"ObjectiveEvaluator","qualifiedName":"src/sckg/retrieval/egpot/objectives.py:ObjectiveEvaluator","kind":"class","file":"src/sckg/retrieval/egpot/objectives.py","line":98,"sourceText":"class ObjectiveEvaluator:\n    def __init__(self, store: GraphStore, config: EGPOTConfig,\n                 provider: EmbeddingProvider | None = None) -> None:\n        self.config = config\n        self.embeddings = provider or make_embedding_provider(\n            config.embedding_provider, config.embedding_model, config.embedding_local_files_only)\n        self.hubs = HubSuppressor(store, config.hub_suppression_enabled, config.hub_degree_threshold)\n        self.entropy = StructuralEntropyEstimator(store, self.hubs)\n        self.novelty = NoveltyEstimator()\n        self.contracts = ContractEvaluator(config)\n        self._query_cache: dict[str, list[float]] = {}\n        self._symbol_cache: dict[str, list[float]] = {}\n\n    def evaluate(\n        self, query: str, trajectory: Trajectory, relation: Relation, candidate: Symbol\n    ) -> tuple[ObjectiveVector, float, float, ContractScore]:\n        semantic = self._semantic(query, candidate) if self.config.semantic_enabled else 0.0\n        hop = -self.config.hop_lambda * (trajectory.depth + 1) if self.config.hop_enabled else 0.0\n        contract = (\n            self.contracts.score(trajectory.current_node, candidate, relation)\n            if self.config.contract_enabled\n            else ContractScore(0.0, ContractStatus.UNKNOWN)\n        )\n        entropy = self.entropy.entropy(candidate) if self.config.entropy_enabled else 0.0\n        novelty = self.novelty.novelty(candidate, relation, trajectory) if self.config.novelty_enabled else 1.0\n        information_gain = entropy * novelty\n        return (\n            ObjectiveVector(semantic, hop, contract.score, information_gain),\n            entropy,\n            novelty,\n            contract,\n        )\n\n    def _semantic(self, query: str, symbol: Symbol) -> float:\n        if query not in self._query_cache:\n            self._query_cache[query] = self.embeddings.embed(query)\n        if symbol.id not in self._symbol_cache:\n            text = \" \".join(\n                filter(\n                    None,\n                    [\n                        symbol.name,\n                        symbol.qualified_name,\n                        symbol.signature or \"\",\n                        symbol.type or \"\",\n                        symbol.file_path,\n                        symbol.source_text or \"\",\n                    ],\n                )\n            )\n            self._symbol_cache[symbol.id] = self.embeddings.embed(text)\n        return cosine(self._query_cache[query], self._symbol_cache[symbol.id])","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_38edc08798e1e8dc65b62613900050e9","label":"__init__","qualifiedName":"src/sckg/retrieval/egpot/objectives.py:ObjectiveEvaluator.__init__","kind":"function","file":"src/sckg/retrieval/egpot/objectives.py","line":99,"sourceText":"    def __init__(self, store: GraphStore, config: EGPOTConfig,\n                 provider: EmbeddingProvider | None = None) -> None:\n        self.config = config\n        self.embeddings = provider or make_embedding_provider(\n            config.embedding_provider, config.embedding_model, config.embedding_local_files_only)\n        self.hubs = HubSuppressor(store, config.hub_suppression_enabled, config.hub_degree_threshold)\n        self.entropy = StructuralEntropyEstimator(store, self.hubs)\n        self.novelty = NoveltyEstimator()\n        self.contracts = ContractEvaluator(config)\n        self._query_cache: dict[str, list[float]] = {}\n        self._symbol_cache: dict[str, list[float]] = {}","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_d42f48f8ea66e9e893bf6d4434584723","label":"evaluate","qualifiedName":"src/sckg/retrieval/egpot/objectives.py:ObjectiveEvaluator.evaluate","kind":"function","file":"src/sckg/retrieval/egpot/objectives.py","line":111,"sourceText":"    def evaluate(\n        self, query: str, trajectory: Trajectory, relation: Relation, candidate: Symbol\n    ) -> tuple[ObjectiveVector, float, float, ContractScore]:\n        semantic = self._semantic(query, candidate) if self.config.semantic_enabled else 0.0\n        hop = -self.config.hop_lambda * (trajectory.depth + 1) if self.config.hop_enabled else 0.0\n        contract = (\n            self.contracts.score(trajectory.current_node, candidate, relation)\n            if self.config.contract_enabled\n            else ContractScore(0.0, ContractStatus.UNKNOWN)\n        )\n        entropy = self.entropy.entropy(candidate) if self.config.entropy_enabled else 0.0\n        novelty = self.novelty.novelty(candidate, relation, trajectory) if self.config.novelty_enabled else 1.0\n        information_gain = entropy * novelty\n        return (\n            ObjectiveVector(semantic, hop, contract.score, information_gain),\n            entropy,\n            novelty,\n            contract,\n        )","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_8a8fcd411a9372e7b2432daf185be95f","label":"_semantic","qualifiedName":"src/sckg/retrieval/egpot/objectives.py:ObjectiveEvaluator._semantic","kind":"function","file":"src/sckg/retrieval/egpot/objectives.py","line":131,"sourceText":"    def _semantic(self, query: str, symbol: Symbol) -> float:\n        if query not in self._query_cache:\n            self._query_cache[query] = self.embeddings.embed(query)\n        if symbol.id not in self._symbol_cache:\n            text = \" \".join(\n                filter(\n                    None,\n                    [\n                        symbol.name,\n                        symbol.qualified_name,\n                        symbol.signature or \"\",\n                        symbol.type or \"\",\n                        symbol.file_path,\n                        symbol.source_text or \"\",\n                    ],\n                )\n            )\n            self._symbol_cache[symbol.id] = self.embeddings.embed(text)\n        return cosine(self._query_cache[query], self._symbol_cache[symbol.id])","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_30a04eabe12c6008d8dea40bbd18ed8a","label":"pareto.py","qualifiedName":"file::src/sckg/retrieval/egpot/pareto.py","kind":"file","file":"src/sckg/retrieval/egpot/pareto.py","line":1,"sourceText":"# File: src/sckg/retrieval/egpot/pareto.py\n# Lines: 113","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_2dc141a3f27220945e7e5fdbf83ec18b","label":"dominates","qualifiedName":"src/sckg/retrieval/egpot/pareto.py:dominates","kind":"function","file":"src/sckg/retrieval/egpot/pareto.py","line":9,"sourceText":"def dominates(left: ObjectiveVector, right: ObjectiveVector, epsilon: float = 1e-8) -> bool:\n    left_values = left.values()\n    right_values = right.values()\n    at_least_as_good = all(a + epsilon >= b for a, b in zip(left_values, right_values, strict=True))\n    strictly_better = any(a > b + epsilon for a, b in zip(left_values, right_values, strict=True))\n    return at_least_as_good and strictly_better","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_b1550c9b25aa499d09850aee98f47921","label":"extract_pareto_frontier","qualifiedName":"src/sckg/retrieval/egpot/pareto.py:extract_pareto_frontier","kind":"function","file":"src/sckg/retrieval/egpot/pareto.py","line":17,"sourceText":"def extract_pareto_frontier(\n    candidates: Sequence[TraversalState], epsilon: float = 1e-8\n) -> list[TraversalState]:\n    return [\n        candidate\n        for candidate in candidates\n        if not any(\n            other is not candidate\n            and dominates(other.objective_vector, candidate.objective_vector, epsilon)\n            for other in candidates\n        )\n    ]","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_5aa4c839c1e8fd288c03e2568ac2d840","label":"non_dominated_sort","qualifiedName":"src/sckg/retrieval/egpot/pareto.py:non_dominated_sort","kind":"function","file":"src/sckg/retrieval/egpot/pareto.py","line":31,"sourceText":"def non_dominated_sort(\n    candidates: Sequence[TraversalState], epsilon: float = 1e-8\n) -> list[list[TraversalState]]:\n    remaining = list(candidates)\n    fronts: list[list[TraversalState]] = []\n    rank = 0\n    while remaining:\n        front = extract_pareto_frontier(remaining, epsilon)\n        ranked = [_replace_rank(item, rank) for item in front]\n        fronts.append(ranked)\n        front_ids = {id(item) for item in front}\n        remaining = [item for item in remaining if id(item) not in front_ids]\n        rank += 1\n    return fronts","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_02ed4e2b3e0f6dfa7ac7be006721276f","label":"assign_crowding_distance","qualifiedName":"src/sckg/retrieval/egpot/pareto.py:assign_crowding_distance","kind":"function","file":"src/sckg/retrieval/egpot/pareto.py","line":47,"sourceText":"def assign_crowding_distance(front: Sequence[TraversalState]) -> list[TraversalState]:\n    if not front:\n        return []\n    if len(front) <= 2:\n        return [_replace_crowding(item, math.inf) for item in front]\n    distances = [0.0 for _ in front]\n    dimensions = list(zip(*(item.objective_vector.values() for item in front), strict=True))\n    for values in dimensions:\n        order = sorted(range(len(front)), key=lambda index: values[index])\n        distances[order[0]] = math.inf\n        distances[order[-1]] = math.inf\n        minimum = values[order[0]]\n        maximum = values[order[-1]]\n        if math.isclose(minimum, maximum):\n            continue\n        for pos in range(1, len(order) - 1):\n            previous_value = values[order[pos - 1]]\n            next_value = values[order[pos + 1]]\n            if not math.isinf(distances[order[pos]]):\n                distances[order[pos]] += (next_value - previous_value) / (maximum - minimum)\n    return [_replace_crowding(item, distances[index]) for index, item in enumerate(front)]","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_5a8cf37824103ac6c62f7bb1e6539de9","label":"select_by_fronts","qualifiedName":"src/sckg/retrieval/egpot/pareto.py:select_by_fronts","kind":"function","file":"src/sckg/retrieval/egpot/pareto.py","line":70,"sourceText":"def select_by_fronts(fronts: Sequence[Sequence[TraversalState]], width: int) -> list[TraversalState]:\n    selected: list[TraversalState] = []\n    for front in fronts:\n        crowded = assign_crowding_distance(front)\n        ordered = sorted(\n            crowded,\n            key=lambda item: (\n                item.pareto_rank,\n                -_finite_crowding(item.crowding_distance),\n                -sum(item.objective_vector.values()),\n                item.current_node.qualified_name,\n            ),\n        )\n        for item in ordered:\n            if len(selected) >= width:\n                return selected\n            selected.append(item)\n    return selected","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_cc0063211be35434bcc5fee0b8b4a812","label":"_finite_crowding","qualifiedName":"src/sckg/retrieval/egpot/pareto.py:_finite_crowding","kind":"function","file":"src/sckg/retrieval/egpot/pareto.py","line":90,"sourceText":"def _finite_crowding(value: float) -> float:\n    return 1e12 if math.isinf(value) else value","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_95619c1c03ba32527bff35ce9b92979c","label":"_replace_rank","qualifiedName":"src/sckg/retrieval/egpot/pareto.py:_replace_rank","kind":"function","file":"src/sckg/retrieval/egpot/pareto.py","line":94,"sourceText":"def _replace_rank(item: TraversalState, rank: int) -> TraversalState:\n    return TraversalState(\n        trajectory=item.trajectory,\n        objective_vector=item.objective_vector,\n        estimated_tokens=item.estimated_tokens,\n        pareto_rank=rank,\n        crowding_distance=item.crowding_distance,\n        metadata=item.metadata,\n    )","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_f4497fafc5b4433c497eb3f79d0e09cb","label":"_replace_crowding","qualifiedName":"src/sckg/retrieval/egpot/pareto.py:_replace_crowding","kind":"function","file":"src/sckg/retrieval/egpot/pareto.py","line":105,"sourceText":"def _replace_crowding(item: TraversalState, crowding: float) -> TraversalState:\n    return TraversalState(\n        trajectory=item.trajectory,\n        objective_vector=item.objective_vector,\n        estimated_tokens=item.estimated_tokens,\n        pareto_rank=item.pareto_rank,\n        crowding_distance=crowding,\n        metadata=item.metadata,\n    )","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_08b2b726813e72e5ec456231305cc129","label":"serializer.py","qualifiedName":"file::src/sckg/retrieval/egpot/serializer.py","kind":"file","file":"src/sckg/retrieval/egpot/serializer.py","line":1,"sourceText":"# File: src/sckg/retrieval/egpot/serializer.py\n# Lines: 41","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_53c17ecbdb6f18d80f6f0bdd1a68c810","label":"explain_traversal","qualifiedName":"src/sckg/retrieval/egpot/serializer.py:explain_traversal","kind":"function","file":"src/sckg/retrieval/egpot/serializer.py","line":6,"sourceText":"def explain_traversal(result: TraversalResult) -> str:\n    lines = [\n        \"EG-POT Traversal\",\n        \"\",\n        f\"Search: {'Beam-MCTS' if result.debug.get('mcts_enabled') else 'Pareto beam'}\",\n        f\"Simulations: {result.debug.get('simulations', 0)}\",\n        f\"Embedding provider: {result.debug.get('embedding_provider', 'unknown')}\",\n        \"\",\n        \"Seed nodes:\",\n    ]\n    for seed in result.seed_nodes:\n        lines.append(\n            f\"- {seed.symbol.qualified_name} score={seed.score:.3f} \"\n            f\"lexical={seed.lexical_score:.3f} semantic={seed.semantic_score:.3f}\"\n        )\n    lines.extend([\"\", \"Selected trajectories:\"])\n    for index, trajectory in enumerate(result.best_trajectories, start=1):\n        lines.append(f\"Path {index}:\")\n        lines.append(f\"  [0] {trajectory.nodes[0].qualified_name} ({trajectory.nodes[0].file_path})\")\n        for hop in trajectory.hops:\n            lines.append(\n                f\"  [{hop.hop_number}] {hop.relation.relation_type.value} -> \"\n                f\"{hop.target.qualified_name} ({hop.target.file_path})\"\n            )\n            lines.append(f\"      {hop.reason}\")\n    lines.extend(\n        [\n            \"\",\n            f\"Stop reason: {result.stop_reason.value}\",\n            f\"Visited nodes: {len(result.visited_nodes)}\",\n            f\"Selected nodes: {len(result.selected_nodes)}\",\n            f\"Selected edges: {len(result.selected_edges)}\",\n            f\"Traversal time: {result.traversal_time:.4f}s\",\n        ]\n    )\n    return \"\\n\".join(lines)","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_f17b78919c8568eeb4aa4cdd0a65b16a","label":"export.py","qualifiedName":"file::src/sckg/visualization/export.py","kind":"file","file":"src/sckg/visualization/export.py","line":1,"sourceText":"# File: src/sckg/visualization/export.py\n# Lines: 930","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_9034edb679359cbb0ecbda35313e952f","label":"html","qualifiedName":"module::html","kind":"module","file":"src/sckg/visualization/export.py","line":1,"sourceText":"","layer":"Ldep","color":"#475569","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_e3098828d5268fd3af3932890c5c7a67","label":"GraphVisualization","qualifiedName":"src/sckg/visualization/export.py:GraphVisualization","kind":"class","file":"src/sckg/visualization/export.py","line":12,"sourceText":"class GraphVisualization:\n    nodes: list[dict[str, object]]\n    links: list[dict[str, object]]","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_d09f509fc78301ffb1bf94f0e125d2dc","label":"graph_to_visualization","qualifiedName":"src/sckg/visualization/export.py:graph_to_visualization","kind":"function","file":"src/sckg/visualization/export.py","line":32,"sourceText":"def graph_to_visualization(\n    symbols: list[Symbol],\n    relations: list[Relation],\n    egpot_trace: dict[str, object] | None = None,\n) -> GraphVisualization:\n    symbol_by_id = {symbol.id: symbol for symbol in symbols}\n    selected_nodes = set(_trace_ids(egpot_trace, \"selected_nodes\"))\n    seed_nodes = set(_trace_ids(egpot_trace, \"seeds\"))\n    selected_edges = set(_trace_ids(egpot_trace, \"selected_edges\"))\n    objective_scores = egpot_trace.get(\"objective_scores\", {}) if egpot_trace else {}\n    if not isinstance(objective_scores, dict):\n        objective_scores = {}\n    nodes = [\n        {\n            \"id\": symbol.id,\n            \"label\": symbol.name,\n            \"qualifiedName\": symbol.qualified_name,\n            \"kind\": symbol.kind.value,\n            \"file\": symbol.file_path,\n            \"line\": symbol.start_line,\n            \"sourceText\": symbol.source_text or \"\",\n            \"layer\": str(symbol.metadata.get(\"layer\", \"\")),\n            \"color\": KIND_COLORS.get(symbol.kind.value, \"#475569\"),\n            \"egpotSelected\": symbol.id in selected_nodes,\n            \"egpotSeed\": symbol.id in seed_nodes,\n            \"egpotObjectives\": objective_scores.get(symbol.id, []),\n        }\n        for symbol in symbols\n    ]\n    links = [\n        {\n            \"id\": relation.id,\n            \"source\": relation.source_symbol_id,\n            \"target\": relation.target_symbol_id,\n            \"type\": relation.relation_type.value,\n            \"confidence\": relation.confidence,\n            \"provenance\": relation.provenance.value,\n            \"layer\": str(relation.metadata.get(\"layer\", \"\")),\n            \"egpotSelected\": relation.id in selected_edges,\n        }\n        for relation in relations\n        if relation.source_symbol_id in symbol_by_id and relation.target_symbol_id in symbol_by_id\n    ]\n    return GraphVisualization(nodes=nodes, links=links)","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_967e293224f6adcbb99c736a7a73bdac","label":"write_graph_html","qualifiedName":"src/sckg/visualization/export.py:write_graph_html","kind":"function","file":"src/sckg/visualization/export.py","line":78,"sourceText":"def write_graph_html(\n    output_path: Path,\n    symbols: list[Symbol],\n    relations: list[Relation],\n    title: str = \"SCKG Graph\",\n    egpot_trace: dict[str, object] | None = None,\n    comparison_traces: dict[str, dict[str, object]] | None = None,\n) -> Path:\n    visualization = graph_to_visualization(symbols, relations, egpot_trace)\n    payload = json.dumps(\n        {\n            \"nodes\": visualization.nodes,\n            \"links\": visualization.links,\n            \"egpot\": {\n                \"enabled\": egpot_trace is not None,\n                \"runs\": {\"Current run\": egpot_trace, **(comparison_traces or {})}\n                        if egpot_trace is not None else {},\n                \"query\": egpot_trace.get(\"query\", \"\") if egpot_trace else \"\",\n                \"stopReason\": egpot_trace.get(\"stop_reason\", \"\") if egpot_trace else \"\",\n            },\n        },\n        ensure_ascii=False,\n        separators=(\",\", \":\"),\n    )\n    payload = payload.replace(\"<\/\", \"<\\\\/\")\n    output_path.parent.mkdir(parents=True, exist_ok=True)\n    output_path.write_text(_html_document(title, payload), encoding=\"utf-8\")\n    return output_path","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_d50089db46cf20337a90c06100e8399e","label":"_trace_ids","qualifiedName":"src/sckg/visualization/export.py:_trace_ids","kind":"function","file":"src/sckg/visualization/export.py","line":108,"sourceText":"def _trace_ids(egpot_trace: dict[str, object] | None, key: str) -> list[str]:\n    if not egpot_trace:\n        return []\n    values = egpot_trace.get(key, [])\n    if not isinstance(values, list):\n        return []\n    return [value for value in values if isinstance(value, str)]","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_4ff91f8183233d87d8ff690766da9e49","label":"_html_document","qualifiedName":"src/sckg/visualization/export.py:_html_document","kind":"function","file":"src/sckg/visualization/export.py","line":117,"sourceText":"def _html_document(title: str, payload: str) -> str:\n    escaped_title = html.escape(title)\n    trace_panel = Path(__file__).with_name(\"trace_panel.js\").read_text(encoding=\"utf-8\")\n    return f\"\"\"<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>{escaped_title}<\/title>\n  <style>\n    :root {{\n      color-scheme: light;\n      --bg: #f8fafc;\n      --panel: #ffffff;\n      --ink: #0f172a;\n      --muted: #64748b;\n      --line: #dbe3ee;\n      --accent: #2563eb;\n      --edge: #94a3b8;\n      --egpot: #dc2626;\n      --egpot-seed: #0891b2;\n    }}\n    * {{ box-sizing: border-box; }}\n    body {{\n      margin: 0;\n      min-height: 100vh;\n      overflow: hidden;\n      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      color: var(--ink);\n      background: var(--bg);\n    }}\n    .app {{\n      display: grid;\n      grid-template-columns: minmax(280px, 340px) 1fr;\n      height: 100vh;\n    }}\n    aside {{\n      border-right: 1px solid var(--line);\n      background: var(--panel);\n      padding: 18px;\n      overflow: auto;\n    }}\n    main {{\n      position: relative;\n      min-width: 0;\n    }}\n    h1 {{\n      margin: 0 0 6px;\n      font-size: 20px;\n      font-weight: 700;\n    }}\n    .stats {{\n      color: var(--muted);\n      margin-bottom: 18px;\n    }}\n    label {{\n      display: block;\n      margin: 14px 0 6px;\n      font-weight: 650;\n      color: #334155;\n    }}\n    input, select {{\n      width: 100%;\n      height: 36px;\n      border: 1px solid var(--line);\n      border-radius: 6px;\n      padding: 0 10px;\n      background: #fff;\n      color: var(--ink);\n    }}\n    .legend {{\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 8px 12px;\n      margin-top: 18px;\n    }}\n    .egpot-summary {{\n      display: none;\n      margin: 14px 0 0;\n      padding: 10px;\n      border: 1px solid #fecaca;\n      border-radius: 6px;\n      background: #fff7f7;\n      color: #7f1d1d;\n    }}\n    .egpot-summary.active {{\n      display: block;\n    }}\n    .legend-item {{\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      min-width: 0;\n      color: #334155;\n    }}\n    .swatch {{\n      width: 11px;\n      height: 11px;\n      border-radius: 50%;\n      flex: 0 0 auto;\n    }}\n    .details {{\n      margin-top: 20px;\n      padding-top: 16px;\n      border-top: 1px solid var(--line);\n      color: #334155;\n      word-break: break-word;\n    }}\n    .details strong {{\n      display: block;\n      color: var(--ink);\n      margin-bottom: 6px;\n    }}\n    .details-row {{\n      margin: 3px 0;\n    }}\n    .details-code {{\n      max-height: 220px;\n      overflow: auto;\n      margin: 10px 0 0;\n      padding: 10px;\n      border: 1px solid var(--line);\n      border-radius: 6px;\n      background: #0f172a;\n      color: #e2e8f0;\n      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n      white-space: pre;\n    }}\n    .related-block {{\n      margin-top: 12px;\n    }}\n    .related-title {{\n      margin-bottom: 6px;\n      font-weight: 700;\n      color: var(--ink);\n    }}\n    .related-list {{\n      display: grid;\n      gap: 6px;\n    }}\n    .related-item {{\n      width: 100%;\n      height: auto;\n      min-height: 34px;\n      border: 1px solid var(--line);\n      border-radius: 6px;\n      padding: 6px 8px;\n      background: #fff;\n      text-align: left;\n      cursor: pointer;\n    }}\n    .related-item:hover {{\n      border-color: var(--accent);\n      background: #eff6ff;\n    }}\n    .relation-chip {{\n      display: inline-block;\n      margin-right: 6px;\n      color: #1d4ed8;\n      font-size: 12px;\n      font-weight: 700;\n    }}\n    .inspect-section {{\n      margin-top: 18px;\n      padding-top: 14px;\n      border-top: 1px solid var(--line);\n    }}\n    .inspect-title {{\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      margin-bottom: 8px;\n      color: #334155;\n      font-weight: 700;\n    }}\n    .count {{\n      color: var(--muted);\n      font-size: 12px;\n      font-weight: 500;\n    }}\n    .item-list {{\n      display: grid;\n      gap: 6px;\n      max-height: 210px;\n      overflow: auto;\n      padding-right: 2px;\n    }}\n    .list-item {{\n      width: 100%;\n      height: auto;\n      min-height: 38px;\n      border: 1px solid var(--line);\n      border-radius: 6px;\n      padding: 7px 8px;\n      background: #fff;\n      color: #1e293b;\n      text-align: left;\n      cursor: pointer;\n    }}\n    .list-item:hover, .list-item.active {{\n      border-color: var(--accent);\n      background: #eff6ff;\n    }}\n    .item-name {{\n      display: block;\n      overflow: hidden;\n      text-overflow: ellipsis;\n      white-space: nowrap;\n      font-weight: 650;\n    }}\n    .item-meta {{\n      display: block;\n      overflow: hidden;\n      text-overflow: ellipsis;\n      white-space: nowrap;\n      color: var(--muted);\n      font-size: 12px;\n    }}\n    svg {{\n      display: block;\n      width: 100%;\n      height: 100vh;\n      cursor: grab;\n      touch-action: none;\n      background:\n        linear-gradient(#e2e8f0 1px, transparent 1px),\n        linear-gradient(90deg, #e2e8f0 1px, transparent 1px);\n      background-size: 32px 32px;\n    }}\n    svg.dragging {{\n      cursor: grabbing;\n    }}\n    .link {{\n      stroke: var(--edge);\n      stroke-opacity: 0.42;\n    }}\n    .link-hit {{\n      stroke: transparent;\n      stroke-width: 10px;\n      cursor: pointer;\n    }}\n    .link.selected {{\n      stroke: var(--accent);\n      stroke-opacity: 1;\n    }}\n    .link.egpot {{\n      stroke: var(--egpot);\n      stroke-opacity: 0.95;\n    }}\n    .node circle {{\n      stroke: #fff;\n      stroke-width: 0.9px;\n      opacity: 0.88;\n      cursor: pointer;\n    }}\n    .node .hit-circle {{\n      fill: transparent;\n      stroke: transparent;\n      cursor: pointer;\n    }}\n    .node.selected circle:not(.hit-circle) {{\n      stroke: var(--accent);\n      stroke-width: 1.8px;\n      opacity: 1;\n    }}\n    .node.egpot circle:not(.hit-circle) {{\n      stroke: var(--egpot);\n      stroke-width: 2.4px;\n      opacity: 1;\n    }}\n    .node.egpot-seed circle:not(.hit-circle) {{\n      stroke: var(--egpot-seed);\n      stroke-width: 2.4px;\n    }}\n    .node text {{\n      pointer-events: none;\n      paint-order: stroke;\n      stroke: #fff;\n      stroke-width: 3px;\n      fill: #0f172a;\n      font-size: 11px;\n    }}\n    .edge-label {{\n      fill: #64748b;\n      font-size: 9px;\n      pointer-events: none;\n      paint-order: stroke;\n      stroke: #fff;\n      stroke-width: 3px;\n    }}\n    .toolbar {{\n      position: absolute;\n      right: 16px;\n      top: 16px;\n      display: flex;\n      gap: 8px;\n    }}\n    button {{\n      height: 34px;\n      border: 1px solid var(--line);\n      border-radius: 6px;\n      padding: 0 12px;\n      background: #fff;\n      color: #1e293b;\n      cursor: pointer;\n    }}\n    button:hover {{ border-color: var(--accent); }}\n    @media (max-width: 760px) {{\n      .app {{ grid-template-columns: 1fr; grid-template-rows: auto 1fr; }}\n      aside {{ max-height: 42vh; border-right: 0; border-bottom: 1px solid var(--line); }}\n      svg {{ height: 58vh; }}\n      .toolbar {{ top: auto; bottom: 12px; right: 12px; }}\n    }}\n  <\/style>\n<\/head>\n<body>\n  <div class=\"app\">\n    <aside>\n      <h1>{escaped_title}<\/h1>\n      <div class=\"stats\" id=\"stats\"><\/div>\n      <div class=\"egpot-summary\" id=\"egpotSummary\"><\/div>\n\n      <label for=\"search\">Search symbols<\/label>\n      <input id=\"search\" type=\"search\" placeholder=\"Qualified name, file, kind\">\n\n      <label for=\"relation\">Relation filter<\/label>\n      <select id=\"relation\">\n        <option value=\"\">All relations<\/option>\n      <\/select>\n\n      <label for=\"layer\">Architecture layer<\/label>\n      <select id=\"layer\">\n        <option value=\"\">All layers<\/option>\n      <\/select>\n\n      <div class=\"legend\" id=\"legend\"><\/div>\n      <div class=\"details\" id=\"details\">Select a node or edge to inspect it.<\/div>\n      <div class=\"inspect-section\">\n        <div class=\"inspect-title\">Nodes <span class=\"count\" id=\"nodeCount\"><\/span><\/div>\n        <div class=\"item-list\" id=\"nodeList\"><\/div>\n      <\/div>\n      <div class=\"inspect-section\">\n        <div class=\"inspect-title\">Edges <span class=\"count\" id=\"edgeCount\"><\/span><\/div>\n        <div class=\"item-list\" id=\"edgeList\"><\/div>\n      <\/div>\n    <\/aside>\n    <main>\n      <div class=\"toolbar\">\n        <button id=\"zoomIn\" title=\"Zoom in\">+<\/button>\n        <button id=\"zoomOut\" title=\"Zoom out\">-<\/button>\n        <button id=\"fit\" title=\"Fit graph to view\">Fit<\/button>\n        <button id=\"labels\" title=\"Toggle labels\">Labels<\/button>\n        <button id=\"egpotOnly\" title=\"Show only EG-POT-selected nodes and edges\">EG-POT<\/button>\n      <\/div>\n      <svg id=\"graph\" role=\"img\" aria-label=\"Interactive semantic code graph\"><\/svg>\n    <\/main>\n  <\/div>\n  <script>\n    const graph = {payload};\n    const svg = document.getElementById(\"graph\");\n    const search = document.getElementById(\"search\");\n    const relation = document.getElementById(\"relation\");\n    const layer = document.getElementById(\"layer\");\n    const details = document.getElementById(\"details\");\n    const stats = document.getElementById(\"stats\");\n    const nodeList = document.getElementById(\"nodeList\");\n    const edgeList = document.getElementById(\"edgeList\");\n    const nodeCount = document.getElementById(\"nodeCount\");\n    const edgeCount = document.getElementById(\"edgeCount\");\n    const labelsButton = document.getElementById(\"labels\");\n    const egpotOnlyButton = document.getElementById(\"egpotOnly\");\n    const egpotSummary = document.getElementById(\"egpotSummary\");\n    const fitButton = document.getElementById(\"fit\");\n    const zoomInButton = document.getElementById(\"zoomIn\");\n    const zoomOutButton = document.getElementById(\"zoomOut\");\n    const width = () => svg.clientWidth || 900;\n    const height = () => svg.clientHeight || 700;\n    let showLabels = true;\n    let transform = {{x: 0, y: 0, k: 1}};\n    let selectedNodeId = \"\";\n    let selectedLinkId = \"\";\n    let egpotOnly = false;\n    let viewport = null;\n    let latestActive = null;\n    let nodes = graph.nodes.map((node, index) => ({{\n      ...node,\n      x: width() / 2 + Math.cos(index) * 220,\n      y: height() / 2 + Math.sin(index) * 220,\n      vx: 0,\n      vy: 0\n    }}));\n    let links = graph.links;\n    const nodeById = new Map(nodes.map(node => [node.id, node]));\n    const relationTypes = [...new Set(links.map(link => link.type))].sort();\n    for (const type of relationTypes) {{\n      const option = document.createElement(\"option\");\n      option.value = type;\n      option.textContent = type;\n      relation.appendChild(option);\n    }}\n    const layers = [...new Set(links.map(link => link.layer).filter(Boolean))].sort();\n    for (const value of layers) {{\n      const option = document.createElement(\"option\");\n      option.value = value;\n      option.textContent = value;\n      layer.appendChild(option);\n    }}\n    const kinds = [...new Map(nodes.map(node => [node.kind, node.color])).entries()].sort();\n    document.getElementById(\"legend\").innerHTML = kinds.map(([kind, color]) =>\n      `<div class=\"legend-item\"><span class=\"swatch\" style=\"background:${{color}}\"><\/span><span>${{kind}}<\/span><\/div>`\n    ).join(\"\") + (graph.egpot.enabled ? `\n      <div class=\"legend-item\"><span class=\"swatch\" style=\"background:var(--egpot)\"><\/span><span>EG-POT selected<\/span><\/div>\n      <div class=\"legend-item\"><span class=\"swatch\" style=\"background:var(--egpot-seed)\"><\/span><span>EG-POT seed<\/span><\/div>\n    ` : \"\");\n    if (graph.egpot.enabled) {{\n      const selectedCount = nodes.filter(node => node.egpotSelected).length;\n      const seedCount = nodes.filter(node => node.egpotSeed).length;\n      const edgeCount = links.filter(link => link.egpotSelected).length;\n      egpotSummary.classList.add(\"active\");\n      egpotSummary.innerHTML = `<strong>EG-POT trace loaded<\/strong><br>${{escapeHtml(graph.egpot.query)}}<br>${{selectedCount}} selected nodes, ${{edgeCount}} selected edges, ${{seedCount}} seeds<br>Stop: ${{escapeHtml(graph.egpot.stopReason)}}`;\n    }} else {{\n      egpotOnlyButton.disabled = true;\n      egpotOnlyButton.title = \"Regenerate with --egpot-trace to enable this overlay\";\n    }}\n\n    function filtered() {{\n      const q = search.value.trim().toLowerCase();\n      const rel = relation.value;\n      const selectedLayer = layer.value;\n      const visibleNodes = new Set(nodes.filter(node => !q ||\n        `${{node.label}} ${{node.qualifiedName}} ${{node.file}} ${{node.kind}}`.toLowerCase().includes(q)\n      ).filter(node => !egpotOnly || node.egpotSelected || node.egpotSeed).map(node => node.id));\n      const visibleLinks = links.filter(link =>\n        (!rel || link.type === rel) &&\n        (!selectedLayer || link.layer === selectedLayer) &&\n        (!egpotOnly || link.egpotSelected) &&\n        visibleNodes.has(link.source) &&\n        visibleNodes.has(link.target)\n      );\n      for (const link of visibleLinks) {{\n        visibleNodes.add(link.source);\n        visibleNodes.add(link.target);\n      }}\n      if (rel || selectedLayer) {{\n        const connected = new Set(visibleLinks.flatMap(link => [link.source, link.target]));\n        for (const id of visibleNodes) {{\n          if (!connected.has(id)) visibleNodes.delete(id);\n        }}\n      }}\n      return {{\n        nodes: nodes.filter(node => visibleNodes.has(node.id)),\n        links: visibleLinks\n      }};\n    }}\n\n    function tick(activeNodes, activeLinks) {{\n      const centerX = width() / 2;\n      const centerY = height() / 2;\n      const iterations = activeNodes.length > 260 ? 2 : 18;\n      const useRepulsion = activeNodes.length <= 260;\n      for (let i = 0; i < iterations; i++) {{\n        for (const node of activeNodes) {{\n          node.vx += (centerX - node.x) * 0.0009;\n          node.vy += (centerY - node.y) * 0.0009;\n        }}\n        if (useRepulsion) {{\n          for (let a = 0; a < activeNodes.length; a++) {{\n            for (let b = a + 1; b < activeNodes.length; b++) {{\n              const left = activeNodes[a];\n              const right = activeNodes[b];\n              const dx = left.x - right.x || 0.1;\n              const dy = left.y - right.y || 0.1;\n              const d2 = Math.max(80, dx * dx + dy * dy);\n              const force = 260 / d2;\n              left.vx += dx * force;\n              left.vy += dy * force;\n              right.vx -= dx * force;\n              right.vy -= dy * force;\n            }}\n          }}\n        }}\n        for (const link of activeLinks) {{\n          const source = nodeById.get(link.source);\n          const target = nodeById.get(link.target);\n          if (!source || !target) continue;\n          const dx = target.x - source.x;\n          const dy = target.y - source.y;\n          const distance = Math.sqrt(dx * dx + dy * dy) || 1;\n          const force = (distance - 140) * 0.004;\n          source.vx += dx / distance * force;\n          source.vy += dy / distance * force;\n          target.vx -= dx / distance * force;\n          target.vy -= dy / distance * force;\n        }}\n        for (const node of activeNodes) {{\n          node.vx *= 0.72;\n          node.vy *= 0.72;\n          node.x += node.vx;\n          node.y += node.vy;\n        }}\n      }}\n    }}\n\n    function render(runLayout = true) {{\n      const active = filtered();\n      latestActive = active;\n      stats.textContent = `${{active.nodes.length}} of ${{nodes.length}} nodes, ${{active.links.length}} of ${{links.length}} relations`;\n      if (runLayout) tick(active.nodes, active.links);\n      renderLists(active);\n      svg.innerHTML = \"\";\n      viewport = document.createElementNS(\"http://www.w3.org/2000/svg\", \"g\");\n      applyViewport();\n      svg.appendChild(viewport);\n\n      for (const link of active.links) {{\n        const source = nodeById.get(link.source);\n        const target = nodeById.get(link.target);\n        if (!source || !target) continue;\n        const hit = document.createElementNS(\"http://www.w3.org/2000/svg\", \"line\");\n        hit.setAttribute(\"class\", \"link-hit\");\n        hit.setAttribute(\"x1\", source.x);\n        hit.setAttribute(\"y1\", source.y);\n        hit.setAttribute(\"x2\", target.x);\n        hit.setAttribute(\"y2\", target.y);\n        hit.addEventListener(\"pointerdown\", event => event.stopPropagation());\n        hit.addEventListener(\"click\", event => {{\n          event.stopPropagation();\n          showEdge(link);\n        }});\n        viewport.appendChild(hit);\n        const line = document.createElementNS(\"http://www.w3.org/2000/svg\", \"line\");\n        line.setAttribute(\"class\", `link${{link.egpotSelected ? \" egpot\" : \"\"}}${{link.id === selectedLinkId ? \" selected\" : \"\"}}`);\n        line.setAttribute(\"x1\", source.x);\n        line.setAttribute(\"y1\", source.y);\n        line.setAttribute(\"x2\", target.x);\n        line.setAttribute(\"y2\", target.y);\n        line.setAttribute(\"stroke-width\", link.id === selectedLinkId ? 2.2 : link.egpotSelected ? 2.6 : Math.max(0.45, link.confidence * 0.95));\n        line.addEventListener(\"pointerdown\", event => event.stopPropagation());\n        line.addEventListener(\"click\", event => {{\n          event.stopPropagation();\n          showEdge(link);\n        }});\n        viewport.appendChild(line);\n        if (showLabels && active.links.length < 180) {{\n          const label = document.createElementNS(\"http://www.w3.org/2000/svg\", \"text\");\n          label.setAttribute(\"class\", \"edge-label\");\n          label.setAttribute(\"x\", (source.x + target.x) / 2);\n          label.setAttribute(\"y\", (source.y + target.y) / 2);\n          label.textContent = link.type;\n          viewport.appendChild(label);\n        }}\n      }}\n\n      for (const node of active.nodes) {{\n        const group = document.createElementNS(\"http://www.w3.org/2000/svg\", \"g\");\n        group.setAttribute(\"class\", `node${{node.egpotSelected ? \" egpot\" : \"\"}}${{node.egpotSeed ? \" egpot-seed\" : \"\"}}${{node.id === selectedNodeId ? \" selected\" : \"\"}}`);\n        group.setAttribute(\"transform\", `translate(${{node.x}} ${{node.y}})`);\n        group.addEventListener(\"pointerdown\", event => event.stopPropagation());\n        group.addEventListener(\"click\", event => {{\n          event.stopPropagation();\n          showNode(node);\n        }});\n        const circle = document.createElementNS(\"http://www.w3.org/2000/svg\", \"circle\");\n        circle.setAttribute(\"r\", radius(node));\n        circle.setAttribute(\"fill\", node.color);\n        group.appendChild(circle);\n        const hitCircle = document.createElementNS(\"http://www.w3.org/2000/svg\", \"circle\");\n        hitCircle.setAttribute(\"class\", \"hit-circle\");\n        hitCircle.setAttribute(\"r\", radius(node) + 8);\n        group.appendChild(hitCircle);\n        if (showLabels && active.nodes.length < 260) {{\n          const text = document.createElementNS(\"http://www.w3.org/2000/svg\", \"text\");\n          text.setAttribute(\"x\", radius(node) + 4);\n          text.setAttribute(\"y\", 4);\n          text.textContent = node.label;\n          group.appendChild(text);\n        }}\n        viewport.appendChild(group);\n      }}\n    }}\n\n    function applyViewport() {{\n      if (!viewport) return;\n      viewport.setAttribute(\"transform\", `translate(${{transform.x}} ${{transform.y}}) scale(${{transform.k}})`);\n    }}\n\n    function radius(node) {{\n      if (node.kind === \"file\") return 4.4;\n      if (node.kind === \"class\") return 4.1;\n      if (node.kind === \"method\" || node.kind === \"function\") return 3.8;\n      return 3.2;\n    }}\n\n    function showNode(node) {{\n      selectedNodeId = node.id;\n      selectedLinkId = \"\";\n      const incoming = links.filter(link => link.target === node.id);\n      const outgoing = links.filter(link => link.source === node.id);\n      details.innerHTML = `\n        <strong>${{escapeHtml(node.qualifiedName)}}<\/strong>\n        <div class=\"details-row\">Kind: ${{escapeHtml(node.kind)}}<\/div>\n        ${{node.layer ? `<div class=\"details-row\">Layer: ${{escapeHtml(node.layer)}}<\/div>` : \"\"}}\n        <div class=\"details-row\">File: ${{escapeHtml(node.file)}}:${{escapeHtml(node.line)}}<\/div>\n        ${{node.egpotSeed ? `<div class=\"details-row\">EG-POT: seed node<\/div>` : \"\"}}\n        ${{node.egpotSelected ? `<div class=\"details-row\">EG-POT: selected context node<\/div>` : \"\"}}\n        ${{node.egpotObjectives?.length ? `<div class=\"details-row\">Objectives: sem=${{Number(node.egpotObjectives[0]).toFixed(3)}}, hop=${{Number(node.egpotObjectives[1]).toFixed(3)}}, contract=${{Number(node.egpotObjectives[2]).toFixed(3)}}, info=${{Number(node.egpotObjectives[3]).toFixed(3)}}<\/div>` : \"\"}}\n        <div class=\"details-row\">Related: ${{incoming.length}} incoming, ${{outgoing.length}} outgoing<\/div>\n        ${{node.sourceText ? `<pre class=\"details-code\">${{escapeHtml(node.sourceText)}}<\/pre>` : \"\"}}\n        ${{relatedBlock(\"Outgoing\", outgoing, \"target\")}}\n        ${{relatedBlock(\"Incoming\", incoming, \"source\")}}\n      `;\n      bindRelatedButtons();\n      render(false);\n    }}\n\n    function showEdge(link) {{\n      selectedLinkId = link.id;\n      selectedNodeId = \"\";\n      const source = nodeById.get(link.source);\n      const target = nodeById.get(link.target);\n      details.innerHTML = `<strong>${{link.type}}<\/strong>\n        <div>Layer: ${{escapeHtml(link.layer || \"unassigned\")}}<\/div>\n        <div>${{source?.qualifiedName || link.source}}<\/div>\n        <div>to ${{target?.qualifiedName || link.target}}<\/div>\n        <div>Confidence: ${{Number(link.confidence).toFixed(2)}}<\/div>\n        <div>Provenance: ${{link.provenance}}<\/div>\n        <div>EG-POT selected: ${{link.egpotSelected ? \"yes\" : \"no\"}}<\/div>`;\n      render(false);\n    }}\n\n    function relatedBlock(title, relatedLinks, oppositeKey) {{\n      if (!relatedLinks.length) return \"\";\n      return `\n        <div class=\"related-block\">\n          <div class=\"related-title\">${{escapeHtml(title)}}<\/div>\n          <div class=\"related-list\">\n            ${{relatedLinks.slice(0, 20).map(link => {{\n              const related = nodeById.get(link[oppositeKey]);\n              return `\n                <button class=\"related-item\" data-related-node=\"${{escapeAttr(relat ata-node]\")) {{\n        button.addEventListener(\"click\", () => {{\n          const node = nodeById.get(button.getAttribute(\"data-node\"));\n          if (node) {{\n            centerOn(node);\n            showNode(node);\n          }}\n        }});\n      }}\n      for (const button of edgeList.querySelectorAll(\"[data-edge]\")) {{\n        button.addEventListener(\"click\", () => {{\n          const link = links.find(item => item.id === button.getAttribute(\"data-edge\"));\n          if (link) {{\n            const source = nodeById.get(link.source);\n            const target = nodeById.get(link.target);\n            if (source && target) centerOn({{x: (source.x + target.x) / 2, y: (source.y + target.y) / 2}});\n            showEdge(link);\n          }}\n        }});\n      }}\n    }}\n\n    function centerOn(point) {{\n      transform.x = width() / 2 - point.x * transform.k;\n      transform.y = height() / 2 - point.y * transform.k;\n      applyViewport();\n    }}\n\n    function escapeHtml(value) {{\n      return String(value).replace(/[&<>\"']/g, char => ({{\n        \"&\": \"&amp;\",\n        \"<\": \"&lt;\",\n        \">\": \"&gt;\",\n        \"\\\\\"\": \"&quot;\",\n        \"'\": \"&#39;\"\n      }}[char]));\n    }}\n\n    function escapeAttr(value) {{\n      return escapeHtml(value);\n    }}\n\n    function fit() {{\n      const active = filtered().nodes;\n      if (!active.length) return;\n      const xs = active.map(node => node.x);\n      const ys = active.map(node => node.y);\n      const minX = Math.min(...xs), maxX = Math.max(...xs);\n      const minY = Math.min(...ys), maxY = Math.max(...ys);\n      const graphWidth = Math.max(1, maxX - minX);\n      const graphHeight = Math.max(1, maxY - minY);\n      const k = Math.min(width() / graphWidth, height() / graphHeight, 1.4) * 0.82;\n      transform = {{\n        k,\n        x: width() / 2 - (minX + graphWidth / 2) * k,\n        y: height() / 2 - (minY + graphHeight / 2) * k\n      }};\n      render     let nodes = graph.nodes.map((node, index) => ({

    }));
    let links = graph.links;
    const nodeById = new Map(nodes.map(node => [node.id, node]));
    const relationTypes = [...new Set(links.map(link => link.type))].sort();
    for (const type of relationTypes) {

      option.value = type;
      option.textContent = type;
      relation.appendChild(option);
    }
    const layers = [...new Set(links.map(link => link.layer).filter(Boolean))].sort();
    for (const value of layers) {

      layer.appendChild(option);

    if (graph.egpot.enabled) {

    function filtered() {

      const rel = relation.value;
      const selectedLayer = layer.value;
      const visibleNodes = new Set(nodes.filter(node => !q ||
        `${node.label} ${node.qualifiedName} ${node.file} ${node.kind}`.toLowerCase().includes(q)
      ).filter(node => !egpotOnly || node.egpotSelected || node.egpotSeed).map(node => node.id));
      const visibleLinks = links.filter(link =>
        (!rel || link.type === rel) &&
        (!selectedLayer || link.layer === selectedLayer) &&
        (!egpotOnly || link.egpotSelected) &&
        visibleNodes.has(link.source) &&
        visibleNodes.has(link.target)
      );
      for (const link of visibleLinks) {
        visibleNodes.add(link.source);
        visibleNodes.add(link.target);
      }
      if (rel || selectedLayer) {
        const connected = new Set(visibleLinks.flatMap(link => [link.source, link.target]));
        for (const id of visibleNodes) {
          if (!connected.has(id)) visibleNodes.delete(id);
        }
      }
      return {
        nodes: nodes.filter(node => visibleNodes.has(node.id)),
        links: visibleLinks

    function tick(activeNodes, activeLinks) {
      const centerX = width() / 2;
      const centerY = height() / 2;
      const iterations = activeNodes.length > 260 ? 2 : 18;
      const useRepulsion = activeNodes.length <= 260;
      for (let i = 0; i < iterations; i++) {
        for (const node of activeNodes) {
          node.vx += (centerX - node.x) * 0.0009;
          node.vy += (centerY - node.y) * 0.0009;
        }
        if (useRepulsion) {
          for (let a = 0; a < activeNodes.length; a++) {
            for (let b = a + 1; b < activeNodes.length; b++) {
              const left = activeNodes[a];
              const right = activeNodes[b];
              const dx = left.x - right.x || 0.1;
              const dy = left.y - right.y || 0.1;
              const d2 = Math.max(80, dx * dx + dy * dy);
              const force = 260 / d2;
              left.vx += dx * force;
              left.vy += dy * force;
              right.vx -= dx * force;
              right.vy -= dy * force;
            }
          }
        }
        for (const link of activeLinks) {
          const source = nodeById.get(link.source);
          const target = nodeById.get(link.target);
          if (!source || !target) continue;
          const dx = target.x - source.x;
          const dy = target.y - source.y;
          const distance = Math.sqrt(dx * dx + dy * dy) || 1;
          const force = (distance - 140) * 0.004;
          source.vx += dx / distance * force;
          source.vy += dy / distance * force;
          target.vx -= dx / distance * force;
          target.vy -= dy / distance * force;
        }
        for (const node of activeNodes) {
          node.vx *= 0.72;
          node.vy *= 0.72;
          node.x += node.vx;
          node.y += node.vy;
        }
      }
    }

      selectedNodeId = node.id;
      selectedLinkId = "";
      const incoming = links.filter(link => link.target === node.id);
      const outgoing = links.filter(link => link.source === node.id);
      details.innerHTML = `
        <strong>${escapeHtml(node.qualifiedName)}</strong>
        <div class="details-row">Kind: ${escapeHtml(node.kind)}</div>
        ${node.layer ? `<div class="details-row">Layer: ${escapeHtml(node.layer)}</div>` : ""}
        <div class="details-row">File: ${escapeHtml(node.file)}:${escapeHtml(node.line)}</div>
        ${node.egpotSeed ? `<div class="details-row">EG-POT: seed node</div>` : ""}
        ${node.egpotSelected ? `<div class="details-row">EG-POT: selected context node</div>` : ""}
        ${node.egpotObjectives?.length ? `<div class="details-row">Objectives: sem=${Number(node.egpotObjectives[0]).toFixed(3)}, hop=${Number(node.egpotObjectives[1]).toFixed(3)}, contract=${Number(node.egpotObjectives[2]).toFixed(3)}, info=${Number(node.egpotObjectives[3]).toFixed(3)}</div>` : ""}
        <div class="details-row">Related: ${incoming.length} incoming, ${outgoing.length} outgoing</div>
        ${node.sourceText ? `<pre class="details-code">${escapeHtml(node.sourceText)}</pre>` : ""}
        ${relatedBlock("Outgoing", outgoing, "target")}
        ${relatedBlock("Incoming", incoming, "source")}
      `;
      bindRelatedButtons();
      render(false);
    }

    function showEdge(link) {
      selectedLinkId = link.id;
      selectedNodeId = "";
      const source = nodeById.get(link.source);
      const target = nodeById.get(link.target);
      details.innerHTML = `<strong>${link.type}</strong>
        <div>Layer: ${escapeHtml(link.layer || "unassigned")}</div>
        <div>${source?.qualifiedName || link.source}</div>
        <div>to ${target?.qualifiedName || link.target}</div>
        <div>Confidence: ${Number(link.confidence).toFixed(2)}</div>
        <div>Provenance: ${link.provenance}</div>
        <div>EG-POT selected: ${link.egpotSelected ? "yes" : "no"}</div>`;
      render(false);
    }

    function relatedBlock(title, relatedLinks, oppositeKey) {
      if (!relatedLinks.length) return "";
      return `
        <div class="related-block">
          <div class="related-title">${escapeHtml(title)}</div>
          <div class="related-list">
            ${relatedLinks.slice(0, 20).map(link => {
              const related = nodeById.get(link[oppositeKey]);
              return `
                <button class="related-item" data-related-node="${escapeAttr(related?.id || "")}">
                  <span class="relation-chip">${escapeHtml(link.type)}</span>
                  <span>${escapeHtml(related?.qualifiedName || link[oppositeKey])}</span>
                </button>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function bindRelatedButtons() {
      for (const button of details.querySelectorAll("[data-related-node]")) {
        button.addEventListener("click", () => {
          const node = nodeById.get(button.getAttribute("data-related-node"));
          if (node) {
            centerOn(node);
            showNode(node);
          }
        });
      }
    }

    function renderLists(active) {
      nodeCount.textContent = `${active.nodes.length} visible`;
      edgeCount.textContent = `${active.links.length} visible`;
      nodeList.innerHTML = active.nodes.slice(0, 120).map(node => `
        <button class="list-item${node.id === selectedNodeId ? " active" : ""}" data-node="${escapeAttr(node.id)}">
          <span class="item-name">${escapeHtml(node.label)}</span>
          <span class="item-meta">${escapeHtml(node.kind)} · ${escapeHtml(node.qualifiedName)}</span>
        </button>
      `).join("");
      edgeList.innerHTML = active.links.slice(0, 120).map(link => {
        const source = nodeById.get(link.source);
        const target = nodeById.get(link.target);
        return `
          <button class="list-item${link.id === selectedLinkId ? " active" : ""}" data-edge="${escapeAttr(link.id)}">
            <span class="item-name">${escapeHtml(link.type)}</span>
            <span class="item-meta">${escapeHtml(link.layer || "")} · ${escapeHtml(source?.label || link.source)} -> ${escapeHtml(target?.label || link.target)}</span>
          </button>
        `;
      }).join("");
      for (const button of nodeList.querySelectorAll("[data-node]")) {
        button.addEventListener("click", () => {
          const node = nodeById.get(button.getAttribute("data-node"));
          if (node) {
            centerOn(node);
            showNode(node);
          }
        });
      }
      for (const button of edgeList.querySelectorAll("[data-edge]")) {
        button.addEventListener("click", () => {
          const link = links.find(item => item.id === button.getAttribute("data-edge"));
          if (link) {
            const source = nodeById.get(link.source);
            const target = nodeById.get(link.target);
            if (source && target) centerOn({x: (source.x + target.x) / 2, y: (source.y + target.y) / 2});
            showEdge(link);
          }
        });
      }
    }

    function centerOn(point) {
      transform.x = width() / 2 - point.x * transform.k;
      transform.y = height() / 2 - point.y * transform.k;
      applyViewport();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function fit() {
      const active = filtered().nodes;
      if (!active.length) return;
      const xs = active.map(node => node.x);
      const ys = active.map(node => node.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const graphWidth = Math.max(1, maxX - minX);
      const graphHeight = Math.max(1, maxY - minY);
      const k = Math.min(width() / graphWidth, height() / graphHeight, 1.4) * 0.82;
      transform = {
        k,
        x: width() / 2 - (minX + graphWidth / 2) * k,
        y: height() / 2 - (minY + graphHeight / 2) * k
      };
      render(false);
    }

    function zoomAt(clientX, clientY, scaleFactor) {
      const bounds = svg.getBoundingClientRect();
      const cursorX = clientX - bounds.left;
      const cursorY = clientY - bounds.top;
      const worldX = (cursorX - transform.x) / transform.k;
      const worldY = (cursorY - transform.y) / transform.k;
      const nextK = Math.max(0.18, Math.min(5.5, transform.k * scaleFactor));
      transform.x = cursorX - worldX * nextK;
      transform.y = cursorY - worldY * nextK;
      transform.k = nextK;
      applyViewport();
    }

    function zoomAtCenter(scaleFactor) {
      const bounds = svg.getBoundingClientRect();
      zoomAt(bounds.left + bounds.width / 2, bounds.top + bounds.height / 2, scaleFactor);
    }

    let dragging = null;
    svg.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;
      dragging = {
        pointerX: event.clientX,
        pointerY: event.clientY,
        startX: transform.x,
        startY: transform.y
      };
      svg.classList.add("dragging");
      svg.setPointerCapture(event.pointerId);
    });
    svg.addEventListener("pointermove", event => {
      if (!dragging) return;
      transform.x = dragging.startX + event.clientX - dragging.pointerX;
      transform.y = dragging.startY + event.clientY - dragging.pointerY;
      applyViewport();
    });
    svg.addEventListener("pointerup", () => {
      dragging = null;
      svg.classList.remove("dragging");
    });
    svg.addEventListener("pointercancel", () => {
      dragging = null;
      svg.classList.remove("dragging");
    });
    svg.addEventListener("wheel", event => {
      event.preventDefault();
      const scaleFactor = Math.exp(-event.deltaY * 0.0015);
      zoomAt(event.clientX, event.clientY, scaleFactor);
    }, {passive: false});
    search.addEventListener("input", () => render(true));
    relation.addEventListener("change", () => render(true));
    layer.addEventListener("change", () => render(true));
    labelsButton.addEventListener("click", () => {
      showLabels = !showLabels;
      render(false);
    });
    egpotOnlyButton.addEventListener("click", () => {
      egpotOnly = !egpotOnly;
      egpotOnlyButton.textContent = egpotOnly ? "All" : "EG-POT";
      render(true);
      setTimeout(fit, 20);
    });
    zoomInButton.addEventListener("click", () => zoomAtCenter(1.2));
    zoomOutButton.addEventListener("click", () => zoomAtCenter(1 / 1.2));
    fitButton.addEventListener("click", fit);
    window.addEventListener("resize", () => render(false));
    render();
    setTimeout(fit, 60);
    // Replay saved retrieval evidence. Controls never pretend to rerun inference.
(() => {
  const runs = Object.entries(graph.egpot.runs || {});
  if (!runs.length) return;
  const style = document.createElement('style');
  style.textContent = `
    .run-panel { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
    .run-panel h2 { font-size:16px; margin:0 0 4px; }
    .run-note { color:#64748b; font-size:12px; margin:6px 0; }
    .run-metrics { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
    .run-metric { padding:9px; background:#f1f5f9; border-radius:7px; overflow-wrap:anywhere; }
    .run-metric b { display:block; color:#0f172a; font-size:17px; }
    .run-metric span { font-size:11px; color:#475569; }
    .run-path { line-height:1.8; overflow-wrap:anywhere; padding:8px; background:#eff6ff; border-radius:6px; }
    .run-tree { max-height:190px; overflow:auto; }
    .run-tree button { margin:3px 0; width:100%; height:auto; padding:8px; text-align:left; overflow-wrap:anywhere; }
    .node.hub circle:not(.hit-circle) { stroke:#d97706; stroke-width:3; stroke-dasharray:2 2; }
    .node.suppressed circle:not(.hit-circle) { fill:#fef3c7; opacity:.5; }
    .run-panel input[type=range] { padding:0; }
  `;
  document.head.appendChild(style);
  const panel = document.createElement('section');
  panel.className = 'run-panel';
  panel.innerHTML = `
    <h2>Search evidence</h2>
    <p class="run-note">Recorded runs from the Python retrieval engine. Choose a run to compare its actual results.</p>
    <label for="runSelect">Recorded run</label><select id="runSelect"></select>
    <div class="run-metrics" id="runMetrics"></div>
    <p class="run-note" id="hubStatus"></p>
    <p class="run-note" id="runDifference"></p>
    <label for="pathSelect">Selected trajectory</label><select id="pathSelect"></select>
    <label for="hopStep" id="hopLabel">Replay hops</label>
    <input id="hopStep" type="range" min="0" value="0" aria-label="Replay hops">
    <div class="run-path" id="pathDescription"></div>
    <p class="run-note">Red outlines: selected path. Cyan: seed. Amber dashes: high in-degree hub. Use All to inspect excluded nodes.</p>
    <details><summary>MCTS visits and values</summary><p class="run-note">Each row is a trajectory-tree state. Values are mean backpropagated rewards; they are not probabilities.</p><div class="run-tree" id="runTree"></div></details>
  `;
  egpotSummary.after(panel);
  const el = id => document.getElementById(id);
  const runSelect = el('runSelect'), pathSelect = el('pathSelect'), hopStep = el('hopStep');
  runs.forEach(([label], index) => runSelect.add(new Option(label, String(index))));
  let current = runs[0][1], paths = [], suppressed = new Set();
  const incoming = new Map(nodes.map(n => [n.id, new Set()]));
  for (const edge of links) if (edge.source !== edge.target) incoming.get(edge.target)?.add(edge.source);
  const name = id => nodeById.get(id)?.qualifiedName || id;
  const metric = (label, value) => `<div class="run-metric"><b>${escapeHtml(value)}</b><span>${escapeHtml(label)}</span></div>`;
  const originalShowNode = showNode;
  showNode = function(node) {
    originalShowNode(node);
    const row = document.createElement('div');
    row.className = 'details-row';
    row.textContent = `In-degree in displayed graph: ${incoming.get(node.id)?.size || 0}. ${suppressed.has(node.id) ? 'Excluded as a hub in this run.' : node.isHub ? 'Above this run’s hub threshold.' : ''}`;
    details.prepend(row);
    decorate();
  };
  const originalRender = render;
  render = function(...args) { originalRender(...args); decorate(); };
  function decorate() {
    if (!latestActive) return;
    // Node groups are created in the same order as filtered graph nodes.
    const visible = filtered().nodes;
    svg.querySelectorAll('g.node').forEach((group, index) => {
      const node = visible[index];
      group.classList.toggle('hub', Boolean(node?.isHub));
      group.classList.toggle('suppressed', suppressed.has(node?.id));
    });
  }
  function chooseRun() {
    current = runs[Number(runSelect.value)][1];
    const searchInfo = current.search || {};
    suppressed = new Set(searchInfo.suppressed_hubs || []);
    const selected = new Set(current.selected_nodes || []);
    const baseline = new Set(runs[runs.length - 1][1].selected_nodes || []);
    const added = [...selected].filter(id => !baseline.has(id)).length;
    const removed = [...baseline].filter(id => !selected.has(id)).length;
    const mode = searchInfo.mcts_enabled === true ? 'Beam-MCTS' : searchInfo.mcts_enabled === false ? 'Pareto beam' : 'Legacy trace';
    el('runMetrics').innerHTML = metric('Search', mode) + metric('Simulations', searchInfo.simulations ?? 'Not recorded') + metric('Embedding provider', searchInfo.embedding_provider ?? 'Not recorded') + metric('Selected nodes', selected.size);
    egpotSummary.innerHTML = `<strong>EG-POT trace loaded</strong><br>${escapeHtml(current.query || '')}<br>Stop: ${escapeHtml(current.stop_reason || '')}`;
    el('hubStatus').textContent = searchInfo.hub_suppression_enabled === undefined
      ? 'Hub settings were not recorded in this older trace.'
      : `Hub suppression ${searchInfo.hub_suppression_enabled ? 'ON' : 'OFF'} · threshold > ${searchInfo.hub_degree_threshold} · ${suppressed.size} encountered hubs excluded.`;
    el('runDifference').textContent = runs.length > 1 ? `Compared with ${runs[runs.length - 1][0]}: ${added} added, ${removed} removed nodes. Paths can change even when node sets match.` : '';
    nodes.forEach(node => {
      node.egpotSeed = (current.seeds || []).includes(node.id);
      node.egpotObjectives = current.objective_scores?.[node.id] || [];
      node.isHub = searchInfo.hub_degree_threshold !== undefined && incoming.get(node.id).size > searchInfo.hub_degree_threshold;
    });
    paths = current.trajectories || [];
    pathSelect.replaceChildren(new Option('All selected context', '-1'));
    paths.forEach((path, index) => pathSelect.add(new Option(`Path ${index + 1} · ${path.edges.length} hops · ${name(path.nodes[path.nodes.length - 1])}`, String(index))));
    pathSelect.value = '-1';
    const tree = searchInfo.tree || [];
    el('runTree').replaceChildren();
    if (!tree.length) el('runTree').textContent = 'No MCTS tree recorded in this run.';
    tree.forEach(row => {
      const button = document.createElement('button');
      button.textContent = `${row.path.map(name).join(' → ')} | visits ${row.visits} | value ${Number(row.mean_value).toFixed(3)} | prior ${Number(row.prior).toFixed(3)}`;
      button.onclick = () => { const node = nodeById.get(row.path[row.path.length - 1]); if (node) showNode(node); };
      el('runTree').appendChild(button);
    });
    selectedNodeId = ''; selectedLinkId = '';
    details.textContent = 'Select a node or edge to inspect it.';
    choosePath();
  }
  function choosePath() {
    const path = paths[Number(pathSelect.value)];
    hopStep.disabled = !path;
    hopStep.max = path ? path.edges.length : 0;
    hopStep.value = hopStep.max;
    replay();
  }
  function replay() {
    const path = paths[Number(pathSelect.value)], step = Number(hopStep.value);
    const nodeIds = new Set(path ? path.nodes.slice(0, step + 1) : current.selected_nodes || []);
    const edgeIds = new Set(path ? path.edges.slice(0, step) : current.selected_edges || []);
    nodes.forEach(node => {
      node.egpotSelected = nodeIds.has(node.id);
      node.egpotSeed = (current.seeds || []).includes(node.id) && (!path || nodeIds.has(node.id));
    });
    links.forEach(link => { link.egpotSelected = edgeIds.has(link.id); });
    el('hopLabel').textContent = path ? `Replay: hop ${step} of ${path.edges.length}` : 'Replay hops';
    el('pathDescription').textContent = path ? path.nodes.slice(0, step + 1).map(name).join(' → ') : paths.length ? 'Choose a trajectory, then drag the slider to follow each hop.' : 'This older trace stores the selected subgraph but no ordered paths.';
    render(false); fit();
  }
  runSelect.addEventListener('change', chooseRun);
  pathSelect.addEventListener('change', choosePath);
  hopStep.addEventListener('input', replay);
  egpotOnly = true;
  egpotOnlyButton.textContent = 'All';
  chooseRun();
})();

  </script>
