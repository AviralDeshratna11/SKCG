g or EGPOTConfig()\n        self.provider = provider\n        self.objectives = ObjectiveEvaluator(store, self.config, provider)\n\n    def traverse(\n        self,\n        query: str,\n        seed_nodes: list[Seed],\n        *,\n        max_hops: int | None = None,\n        beam_width: int | None = None,\n        token_budget: int | None = None,\n    ) -> TraversalResult:\n        max_depth = max_hops if max_hops is not None else self.config.max_hops\n        width = beam_width if beam_width is not None else self.config.beam_width\n        budget = token_budget if token_budget is not None else self.config.token_budget\n        if max_depth < 0 or width < 1 or budget < 1:\n            raise ValueError(\"max_hops must be nonnegative; beam_width and token_budget positive\")\n        self.objectives = ObjectiveEvaluator(self.store, self.config, self.provider)\n        seeds = [seed for seed in seed_nodes\n                 if not self.objectives.hubs.is_hub(seed.symbol.id)\n                 and self._estimate_tokens(Trajectory((seed.symbol,))) <= budget][\n                     : self.config.seed_max_seeds]\n        beam = [\n            TraversalState(Trajectory((seed.symbol,)), ObjectiveVector(seed.semantic_score, 0.0, 1.0, 0.0))\n            for seed in seeds\n        ]\n        visited_nodes: dict[str, Symbol] = {seed.symbol.id: seed.symbol for seed in seeds}\n        visited_edges: dict[str, Relation] = {}\n        objective_scores: dict[str, ObjectiveVector] = {\n            state.current_node.id: state.objective_vector for state in beam\n        }\n        entropy_values: dict[str, float] = {}\n        all_candidates: list[TraversalState] = []\n        trace: list[dict[str, object]] = []\n        stop_reason = StopReason.MAX_HOPS\n        if not beam:\n            stop_reason = (StopReason.TOKEN_BUDGET if any(\n                not self.objectives.hubs.is_hub(seed.symbol.id)\n                and self._estimate_tokens(Trajectory((seed.symbol,))) > budget\n                for seed in seed_nodes) else StopReason.NO_CANDIDATES)\n        def expand(state: TraversalState) -> list[TraversalState]:\n            nonlocal stop_reason\n            candidates: list[TraversalState] = []\n            for relation, candidate in self._expand(state.current_node):\n                if state.trajectory.creates_cycle(candidate):\n                    continue\n                vector, entropy, novelty, contract = self.objectives.evaluate(\n                    query, state.trajectory, relation, candidate)\n                extended = state.trajectory.extend(\n                    relation, candidate, vector, entropy, novelty, contract,\n                    self._reason(vector, entropy, novelty, relation))\n                candidate_state = TraversalState(\n                    extended, vector, estimated_tokens=self._estimate_tokens(extended),\n                    metadata={\"entropy\": entropy, \"novelty\": novelty})\n                if candidate_state.estimated_tokens > budget:\n                    stop_reason = StopReason.TOKEN_BUDGET\n                    continue\n                candidates.append(candidate_state)\n                all_candidates.append(candidate_state)\n                visited_nodes[candidate.id] = candidate\n                visited_edges[relation.id] = relation\n                objective_scores[candidate.id] = vector\n                entropy_values[candidate.id] = entropy\n            return candidates\n\n        mcts: BeamMCTS | None = None\n        with Timer() as timer:\n            if self.config.mcts_enabled and beam and max_depth:\n                mcts = BeamMCTS(self.config, max_depth, width)\n                beam = mcts.search(beam, expand)\n                trace = mcts.trace\n                if stop_reason != StopReason.TOKEN_BUDGET:\n                    stop_reason = (StopReason.MAX_HOPS if any(s.depth == max_depth for s in beam)\n                                   else StopReason.NO_CANDIDATES)\n            else:\n                for depth in range(max_depth):\n                    candidates = [candidate for state in beam for candidate in expand(state)]\n                    if not candidates:\n                        if stop_reason != StopReason.TOKEN_BUDGET:\n                            stop_reason = StopReason.NO_CANDIDATES\n                        break\n                    fronts = (non_dominated_sort(candidates, self.config.pareto_epsilon)\n                              if self.config.pareto_enabled else [candidates])\n                    beam = (select_by_fronts(fronts, width) if self.config.crowding_enabled\n                            else list(fronts[0])[:width])\n                    trace.append({\"hop\": depth + 1, \"candidate_count\": len(candidates),\n                                  \"front_sizes\": [len(front) for front in fronts],\n                                  \"selected\": [state.current_node.id for state in beam]})\n            # The token budget also bounds the union of selected trajectories.\n            packed: list[TraversalState] = []\n            for state in beam:\n                union = self._selected_subgraph([*packed, state])\n                if self._estimate_tokens(Trajectory(union.nodes)) <= budget:\n                    packed.append(state)\n                else:\n                    stop_reason = StopReason.TOKEN_BUDGET\n            beam = packed\n            selected = self._selected_subgraph(beam)\n            pareto_front = tuple(extract_pareto_frontier(all_candidates, self.config.pareto_epsilon))\n        selected_ids = {node.id for node in selected.nodes}\n        redundancy = {\n            \"visited_nodes\": float(len(visited_nodes)),\n            \"selected_nodes\": float(len(selected.nodes)),\n            \"pruned_nodes\": float(max(0, len(visited_nodes) - len(selected_ids))),\n        }\n        return TraversalResult(\n            query=query,\n            seed_nodes=tuple(seeds),\n            visited_nodes=tuple(visited_nodes.values()),\n            selected_nodes=selected.nodes,\n            selected_edges=selected.edges,\n            candidate_trajectories=tuple(state.trajectory for state in all_candidates),\n            best_trajectories=tuple(state.trajectory for state in beam),\n            pareto_front=pareto_front,\n            context_subgraph=selected,\n            objective_scores=objective_scores,\n            entropy_values=entropy_values,\n            redundancy_statistics=redundancy,\n            traversal_time=timer.elapsed,\n            stop_reason=stop_reason,\n            debug={\"trace\": trace, \"mcts_enabled\": self.config.mcts_enabled,\n                   \"simulations\": mcts.simulations if mcts else 0,\n                   \"tree\": mcts.statistics() if mcts else [],\n                   \"embedding_provider\": self.config.embedding_provider,\n                   \"hub_suppression_enabled\": self.config.hub_suppression_enabled,\n                   \"hub_degree_threshold\": self.config.hub_degree_threshold,\n                   \"suppressed_hubs\": sorted(self.objectives.hubs.suppressed)},\n        )\n\n    def write_trace(self, result: TraversalResult, output: Path) -> Path:\n        payload = {\n            \"query\": result.query,\n            \"seeds\": [seed.symbol.id for seed in result.seed_nodes],\n            \"stop_reason\": result.stop_reason.value,\n            \"selected_nodes\": [node.id for node in result.selected_nodes],\n            \"selected_edges\": [edge.id for edge in result.selected_edges],\n            \"objective_scores\": {\n                node_id: vector.values() for node_id, vector in result.objective_scores.items()\n            },\n            \"trace\": result.debug.get(\"trace\", []),\n            \"search\": result.debug,\n            \"trajectories\": [{\n                \"nodes\": list(path.node_ids),\n                \"edges\": [hop.relation.id for hop in path.hops],\n                \"objectives\": [list(hop.objective_vector.values()) for hop in path.hops],\n            } for path in result.best_trajectories],\n        }\n        output.parent.mkdir(parents=True, exist_ok=True)\n        output.write_text(json.dumps(payload, indent=2), encoding=\"utf-8\")\n        return output\n\n    def _expand(self, symbol: Symbol) -> list[tuple[Relation, Symbol]]:\n        _, relations = self.store.get_neighbors(symbol.id, list(self.config.allowed_edges), depth=1)\n        expanded: list[tuple[Relation, Symbol]] = []\n        for relation in sorted(relations, key=lambda item: (item.relation_type.value, item.id)):\n            target_id = (\n                relation.target_symbol_id\n                if relation.source_symbol_id == symbol.id\n                else relation.source_symbol_id\n            )\n            target = self._get_symbol_by_id(target_id)\n            if target is not None and not self.objectives.hubs.is_hub(target.id):\n                expanded.append((relation, target))\n        return expanded\n\n    def _get_symbol_by_id(self, symbol_id: str) -> Symbol | None:\n        if isinstance(self.store, JsonGraphStore):\n            return self.store.symbols.get(symbol_id)\n        return self.store.get_symbol(symbol_id)\n\n    def _selected_subgraph(self, states: list[TraversalState]) -> ContextSubgraph:\n        nodes: dict[str, Symbol] = {}\n        edges: dict[str, Relation] = {}\n        for state in states:\n            nodes.update({node.id: node for node in state.trajectory.nodes})\n            edges.update({hop.relation.id: hop.relation for hop in state.trajectory.hops})\n        return ContextSubgraph(tuple(nodes.values()), tuple(edges.values()))\n\n    def _estimate_tokens(self, trajectory: Trajectory) -> int:\n        text = \" \".join(\n            \" \".join(filter(None, [node.qualified_name, node.signature or \"\", node.source_text or \"\"]))\n            for node in trajectory.nodes\n        )\n        return max(1, len(text.split()))\n\n    def _reason(\n        self, vector: ObjectiveVector, entropy: float, novelty: float, relation: Relation\n    ) -> str:\n        return (\n            f\"{relation.relation_type.value}: semantic={vector.semantic_relevance:.3f}, \"\n            f\"hop={vector.hop_efficiency:.3f}, contract={vector.contract_consistency:.3f}, \"\n            f\"entropy={entropy:.3f}, novelty={novelty:.3f}, info={vector.information_gain:.3f}\"\n        )","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_db8c13c2ae1f0b0e3ed6d6cbcab2b54d","label":"__init__","qualifiedName":"src/sckg/retrieval/egpot/explorer.py:EGPOTTraverser.__init__","kind":"function","file":"src/sckg/retrieval/egpot/explorer.py","line":27,"sourceText":"    def __init__(self, store: GraphStore, config: EGPOTConfig | None = None,\n                 provider: EmbeddingProvider | None = None) -> None:\n        self.store = store\n        self.config = config or EGPOTConfig()\n        self.provider = provider\n        self.objectives = ObjectiveEvaluator(store, self.config, provider)","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_ec11a1e07e4506e69a47804bab39b18b","label":"traverse","qualifiedName":"src/sckg/retrieval/egpot/explorer.py:EGPOTTraverser.traverse","kind":"function","file":"src/sckg/retrieval/egpot/explorer.py","line":34,"sourceText":"    def traverse(\n        self,\n        query: str,\n        seed_nodes: list[Seed],\n        *,\n        max_hops: int | None = None,\n        beam_width: int | None = None,\n        token_budget: int | None = None,\n    ) -> TraversalResult:\n        max_depth = max_hops if max_hops is not None else self.config.max_hops\n        width = beam_width if beam_width is not None else self.config.beam_width\n        budget = token_budget if token_budget is not None else self.config.token_budget\n        if max_depth < 0 or width < 1 or budget < 1:\n            raise ValueError(\"max_hops must be nonnegative; beam_width and token_budget positive\")\n        self.objectives = ObjectiveEvaluator(self.store, self.config, self.provider)\n        seeds = [seed for seed in seed_nodes\n                 if not self.objectives.hubs.is_hub(seed.symbol.id)\n                 and self._estimate_tokens(Trajectory((seed.symbol,))) <= budget][\n                     : self.config.seed_max_seeds]\n        beam = [\n            TraversalState(Trajectory((seed.symbol,)), ObjectiveVector(seed.semantic_score, 0.0, 1.0, 0.0))\n            for seed in seeds\n        ]\n        visited_nodes: dict[str, Symbol] = {seed.symbol.id: seed.symbol for seed in seeds}\n        visited_edges: dict[str, Relation] = {}\n        objective_scores: dict[str, ObjectiveVector] = {\n            state.current_node.id: state.objective_vector for state in beam\n        }\n        entropy_values: dict[str, float] = {}\n        all_candidates: list[TraversalState] = []\n        trace: list[dict[str, object]] = []\n        stop_reason = StopReason.MAX_HOPS\n        if not beam:\n            stop_reason = (StopReason.TOKEN_BUDGET if any(\n                not self.objectives.hubs.is_hub(seed.symbol.id)\n                and self._estimate_tokens(Trajectory((seed.symbol,))) > budget\n                for seed in seed_nodes) else StopReason.NO_CANDIDATES)\n        def expand(state: TraversalState) -> list[TraversalState]:\n            nonlocal stop_reason\n            candidates: list[TraversalState] = []\n            for relation, candidate in self._expand(state.current_node):\n                if state.trajectory.creates_cycle(candidate):\n                    continue\n                vector, entropy, novelty, contract = self.objectives.evaluate(\n                    query, state.trajectory, relation, candidate)\n                extended = state.trajectory.extend(\n                    relation, candidate, vector, entropy, novelty, contract,\n                    self._reason(vector, entropy, novelty, relation))\n                candidate_state = TraversalState(\n                    extended, vector, estimated_tokens=self._estimate_tokens(extended),\n                    metadata={\"entropy\": entropy, \"novelty\": novelty})\n                if candidate_state.estimated_tokens > budget:\n                    stop_reason = StopReason.TOKEN_BUDGET\n                    continue\n                candidates.append(candidate_state)\n                all_candidates.append(candidate_state)\n                visited_nodes[candidate.id] = candidate\n                visited_edges[relation.id] = relation\n                objective_scores[candidate.id] = vector\n                entropy_values[candidate.id] = entropy\n            return candidates\n\n        mcts: BeamMCTS | None = None\n        with Timer() as timer:\n            if self.config.mcts_enabled and beam and max_depth:\n                mcts = BeamMCTS(self.config, max_depth, width)\n                beam = mcts.search(beam, expand)\n                trace = mcts.trace\n                if stop_reason != StopReason.TOKEN_BUDGET:\n                    stop_reason = (StopReason.MAX_HOPS if any(s.depth == max_depth for s in beam)\n                                   else StopReason.NO_CANDIDATES)\n            else:\n                for depth in range(max_depth):\n                    candidates = [candidate for state in beam for candidate in expand(state)]\n                    if not candidates:\n                        if stop_reason != StopReason.TOKEN_BUDGET:\n                            stop_reason = StopReason.NO_CANDIDATES\n                        break\n                    fronts = (non_dominated_sort(candidates, self.config.pareto_epsilon)\n                              if self.config.pareto_enabled else [candidates])\n                    beam = (select_by_fronts(fronts, width) if self.config.crowding_enabled\n                            else list(fronts[0])[:width])\n                    trace.append({\"hop\": depth + 1, \"candidate_count\": len(candidates),\n                                  \"front_sizes\": [len(front) for front in fronts],\n                                  \"selected\": [state.current_node.id for state in beam]})\n            # The token budget also bounds the union of selected trajectories.\n            packed: list[TraversalState] = []\n            for state in beam:\n                union = self._selected_subgraph([*packed, state])\n                if self._estimate_tokens(Trajectory(union.nodes)) <= budget:\n                    packed.append(state)\n                else:\n                    stop_reason = StopReason.TOKEN_BUDGET\n            beam = packed\n            selected = self._selected_subgraph(beam)\n            pareto_front = tuple(extract_pareto_frontier(all_candidates, self.config.pareto_epsilon))\n        selected_ids = {node.id for node in selected.nodes}\n        redundancy = {\n            \"visited_nodes\": float(len(visited_nodes)),\n            \"selected_nodes\": float(len(selected.nodes)),\n            \"pruned_nodes\": float(max(0, len(visited_nodes) - len(selected_ids))),\n        }\n        return TraversalResult(\n            query=query,\n            seed_nodes=tuple(seeds),\n            visited_nodes=tuple(visited_nodes.values()),\n            selected_nodes=selected.nodes,\n            selected_edges=selected.edges,\n            candidate_trajectories=tuple(state.trajectory for state in all_candidates),\n            best_trajectories=tuple(state.trajectory for state in beam),\n            pareto_front=pareto_front,\n            context_subgraph=selected,\n            objective_scores=objective_scores,\n            entropy_values=entropy_values,\n            redundancy_statistics=redundancy,\n            traversal_time=timer.elapsed,\n            stop_reason=stop_reason,\n            debug={\"trace\": trace, \"mcts_enabled\": self.config.mcts_enabled,\n                   \"simulations\": mcts.simulations if mcts else 0,\n                   \"tree\": mcts.statistics() if mcts else [],\n                   \"embedding_provider\": self.config.embedding_provider,\n                   \"hub_suppression_enabled\": self.config.hub_suppression_enabled,\n                   \"hub_degree_threshold\": self.config.hub_degree_threshold,\n                   \"suppressed_hubs\": sorted(self.objectives.hubs.suppressed)},\n        )","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_f19728c702bff62ba4861f7536517ec6","label":"expand","qualifiedName":"src/sckg/retrieval/egpot/explorer.py:EGPOTTraverser.traverse.expand","kind":"function","file":"src/sckg/retrieval/egpot/explorer.py","line":71,"sourceText":"        def expand(state: TraversalState) -> list[TraversalState]:\n            nonlocal stop_reason\n            candidates: list[TraversalState] = []\n            for relation, candidate in self._expand(state.current_node):\n                if state.trajectory.creates_cycle(candidate):\n                    continue\n                vector, entropy, novelty, contract = self.objectives.evaluate(\n                    query, state.trajectory, relation, candidate)\n                extended = state.trajectory.extend(\n                    relation, candidate, vector, entropy, novelty, contract,\n                    self._reason(vector, entropy, novelty, relation))\n                candidate_state = TraversalState(\n                    extended, vector, estimated_tokens=self._estimate_tokens(extended),\n                    metadata={\"entropy\": entropy, \"novelty\": novelty})\n                if candidate_state.estimated_tokens > budget:\n                    stop_reason = StopReason.TOKEN_BUDGET\n                    continue\n                candidates.append(candidate_state)\n                all_candidates.append(candidate_state)\n                visited_nodes[candidate.id] = candidate\n                visited_edges[relation.id] = relation\n                objective_scores[candidate.id] = :"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_143f5419cb82f6595520b90baaeae770","label":"_estimate_tokens","qualifiedName":"src/sckg/retrieval/egpot/explorer.py:EGPOTTraverser._estimate_tokens","kind":"function","file":"src/sckg/retrieval/egpot/explorer.py","line":209,"sourceText":"    def _estimate_tokens(self, trajectory: Trajectory) -> int:\n        text = \" \".join(\n            \" \".join(filter(None, [node.qualified_name, node.signature or \"\", node.source_text or \"\"]))\n            for node in trajectory.nodes\n        )\n        return max(1, len(text.split()))","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_87d28e5acdcb9995516b1aa1e03a6849","label":"_reason","qualifiedName":"src/sckg/retrieval/egpot/explorer.py:EGPOTTraverser._reason","kind":"function","file":"src/sckg/retrieval/egpot/explorer.py","line":216,"sourceText":"    def _reason(\n        self, vector: ObjectiveVector, entropy: float, novelty: float, relation: Relation\n    ) -> str:\n        return (\n            f\"{relation.relation_type.value}: semantic={vector.semantic_relevance:.3f}, \"\n            f\"hop={vector.hop_efficiency:.3f}, contract={vector.contract_consistency:.3f}, \"\n            f\"entropy={entropy:.3f}, novelty={novelty:.3f}, info={vector.information_gain:.3f}\"\n        )","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_3d7c8c1b9a6de2f2460216f94c7e63df","label":"hub_suppression.py","qualifiedName":"file::src/sckg/retrieval/egpot/hub_suppression.py","kind":"file","file":"src/sckg/retrieval/egpot/hub_suppression.py","line":1,"sourceText":"# File: src/sckg/retrieval/egpot/hub_suppression.py\n# Lines: 47","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_0a159a4140f46808c4dbed3ba6296a4d","label":"HubSuppressor","qualifiedName":"src/sckg/retrieval/egpot/hub_suppression.py:HubSuppressor","kind":"class","file":"src/sckg/retrieval/egpot/hub_suppression.py","line":7,"sourceText":"class HubSuppressor:\n    \"\"\"Count distinct incoming neighbours; self loops are not hub evidence.\n\n    Instances are scoped to a retrieval so mutations between queries are reflected.\n    \"\"\"\n\n    def __init__(self, store: GraphStore, enabled: bool = True, threshold: int = 10) -> None:\n        if threshold < 1:\n            raise ValueError(\"hub_degree_threshold must be positive\")\n        self.store = store\n        self.enabled = enabled\n        self.threshold = threshold\n        self.suppressed: set[str] = set()\n        self._degrees: dict[str, int] = {}\n        if enabled and isinstance(store, JsonGraphStore):\n            incoming: dict[str, set[str]] = {}\n            for edge in store.relations.values():\n                if edge.source_symbol_id != edge.target_symbol_id:\n                    incoming.setdefault(edge.target_symbol_id, set()).add(edge.source_symbol_id)\n            self._degrees = {key: len(value) for key, value in incoming.items()}\n\n    def in_degree(self, symbol_id: str) -> int:\n        if symbol_id not in self._degrees:\n            if isinstance(self.store, JsonGraphStore):\n                self._degrees[symbol_id] = 0\n            else:\n                _, edges = self.store.get_neighbors(symbol_id, depth=1)\n                self._degrees[symbol_id] = len({\n                    edge.source_symbol_id for edge in edges\n                    if edge.target_symbol_id == symbol_id and edge.source_symbol_id != symbol_id\n                })\n        return self._degrees[symbol_id]\n\n    def is_hub(self, symbol_id: str) -> bool:\n        suppressed = self.enabled and self.in_degree(symbol_id) > self.threshold\n        if suppressed:\n            self.suppressed.add(symbol_id)\n        return suppressed\n\n    def discount(self, symbol_id: str) -> float:\n        return self.threshold / self.in_degree(symbol_id) if self.is_hub(symbol_id) else 1.0","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_c6e4dcc9d08fd85629fc140671316de2","label":"__init__","qualifiedName":"src/sckg/retrieval/egpot/hub_suppression.py:HubSuppressor.__init__","kind":"function","file":"src/sckg/retrieval/egpot/hub_suppression.py","line":13,"sourceText":"    def __init__(self, store: GraphStore, enabled: bool = True, threshold: int = 10) -> None:\n        if threshold < 1:\n            raise ValueError(\"hub_degree_threshold must be positive\")\n        self.store = store\n        self.enabled = enabled\n        self.threshold = threshold\n        self.suppressed: set[str] = set()\n        self._degrees: dict[str, int] = {}\n        if enabled and isinstance(store, JsonGraphStore):\n            incoming: dict[str, set[str]] = {}\n            for edge in store.relations.values():\n                if edge.source_symbol_id != edge.target_symbol_id:\n                    incoming.setdefault(edge.target_symbol_id, set()).add(edge.source_symbol_id)\n            self._degrees = {key: len(value) for key, value in incoming.items()}","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_e713a2cfd116f482f390297e06d0041f","label":"in_degree","qualifiedName":"src/sckg/retrieval/egpot/hub_suppression.py:HubSuppressor.in_degree","kind":"function","file":"src/sckg/retrieval/egpot/hub_suppression.py","line":28,"sourceText":"    def in_degree(self, symbol_id: str) -> int:\n        if symbol_id not in self._degrees:\n            if isinstance(self.store, JsonGraphStore):\n                self._degrees[symbol_id] = 0\n            else:\n                _, edges = self.store.get_neighbors(symbol_id, depth=1)\n                self._degrees[symbol_id] = len({\n                    edge.source_symbol_id for edge in edges\n                    if edge.target_symbol_id == symbol_id and edge.source_symbol_id != symbol_id\n                })\n        return self._degrees[symbol_id]","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_3960137b55a9a9ddd7a1e374a290289a","label":"is_hub","qualifiedName":"src/sckg/retrieval/egpot/hub_suppression.py:HubSuppressor.is_hub","kind":"function","file":"src/sckg/retrieval/egpot/hub_suppression.py","line":40,"sourceText":"    def is_hub(self, symbol_id: str) -> bool:\n        suppressed = self.enabled and self.in_degree(symbol_id) > self.threshold\n        if suppressed:\n            self.suppressed.add(symbol_id)\n        return suppressed","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_def5ffca141e49d23e964f06829a6bec","label":"discount","qualifiedName":"src/sckg/retrieval/egpot/hub_suppression.py:HubSuppressor.discount","kind":"function","file":"src/sckg/retrieval/egpot/hub_suppression.py","line":46,"sourceText":"    def discount(self, symbol_id: str) -> float:\n        return self.threshold / self.in_degree(symbol_id) if self.is_hub(symbol_id) else 1.0","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_76ecd935d6f36ccfcc24e7283e35b248","label":"mcts.py","qualifiedName":"file::src/sckg/retrieval/egpot/mcts.py","kind":"file","file":"src/sckg/retrieval/egpot/mcts.py","line":1,"sourceText":"# File: src/sckg/retrieval/egpot/mcts.py\n# Lines: 117","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_9539ee5b6c2349173312caa12344559f","label":"SearchNode","qualifiedName":"src/sckg/retrieval/egpot/mcts.py:SearchNode","kind":"class","file":"src/sckg/retrieval/egpot/mcts.py","line":14,"sourceText":"class SearchNode:\n    state: TraversalState\n    prior: float = 1.0\n    visits: int = 0\n    value_sum: float = 0.0\n    children: list[SearchNode] = field(default_factory=list)\n    expanded: bool = False\n\n    @property\n    def mean_value(self) -> float:\n        return self.value_sum / self.visits if self.visits else 0.0","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_f6b38b2820e1ace8ec6cb5635a11ac42","label":"mean_value","qualifiedName":"src/sckg/retrieval/egpot/mcts.py:SearchNode.mean_value","kind":"function","file":"src/sckg/retrieval/egpot/mcts.py","line":23,"sourceText":"    def mean_value(self) -> float:\n        return self.value_sum / self.visits if self.visits else 0.0","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_cba19ccee64fdf6418cd501d02675caa","label":"BeamMCTS","qualifiedName":"src/sckg/retrieval/egpot/mcts.py:BeamMCTS","kind":"class","file":"src/sckg/retrieval/egpot/mcts.py","line":27,"sourceText":"class BeamMCTS:\n    \"\"\"Budget is simulations per query, each bounded by max_hops.\n\n    Each expansion keeps only the first non-dominated front, crowding-pruned to\n    beam_width. PUCT selects visited-tree branches; an unvisited branch rolls out\n    greedily by scalarized terminal value. The same tree stores rollout nodes, so\n    later simulations can explore alternatives. Terminal reward is backpropagated\n    to every ancestor. Output is the best sampled terminal paths, not a global\n    optimality guarantee: Pareto/beam pruning and finite budgets can miss paths.\n    \"\"\"\n\n    def __init__(self, config: EGPOTConfig, max_hops: int, width: int) -> None:\n        self.config = config\n        self.max_hops = max_hops\n        self.width = width\n        self.roots: list[SearchNode] = []\n        self.trace: list[dict[str, object]] = []\n        self.simulations = 0\n\n    def value(self, state: TraversalState) -> float:\n        return sum(w * v for w, v in zip(\n            self.config.objective_weights, state.objective_vector.values(), strict=True))\n\n    def _children(self, states: list[TraversalState]) -> list[SearchNode]:\n        if not states:\n            return []\n        fronts = (non_dominated_sort(states, self.config.pareto_epsilon)\n                  if self.config.pareto_enabled else [states])\n        survivors = (select_by_fronts(fronts[:1], self.width) if self.config.crowding_enabled\n                     else sorted(fronts[0], key=lambda s: (-self.value(s), s.trajectory.node_ids))[:self.width])\n        peak = max(self.value(s) for s in survivors)\n        priors = [math.exp(self.value(s) - peak) for s in survivors]\n        total = sum(priors)\n        return [SearchNode(s, p / total) for s, p in zip(survivors, priors, strict=True)]\n\n    def _select(self, children: list[SearchNode], visits: int) -> SearchNode:\n        # Visit each retained branch once before applying PUCT.\n        unseen = [child for child in children if not child.visits]\n        if unseen:\n            return max(unseen, key=lambda child: child.prior)\n        return max(children, key=lambda child: (\n            child.mean_value + self.config.ucb_c * child.prior\n            * math.sqrt(max(1, visits)) / (1 + child.visits)))\n\n    def search(self, seeds: list[TraversalState],\n               expand: Callable[[TraversalState], list[TraversalState]]) -> list[TraversalState]:\n        self.roots = [SearchNode(s, 1 / len(seeds)) for s in seeds]\n        self.trace = []\n        self.simulations = 0\n        terminals: dict[tuple[str, ...], TraversalState] = {}\n        if not seeds:\n            return []\n        for simulation in range(self.config.simulation_budget):\n            node = self._select(self.roots, simulation)\n            path = [node]\n            rollout = node.visits == 0\n            while node.state.depth < self.max_hops:\n                if not node.expanded:\n                    candidates = expand(node.state)\n                    node.children = self._children(candidates)\n                    node.expanded = True\n                    self.trace.append({\n                        \"hop\": node.state.depth + 1,\n                        \"path\": list(node.state.trajectory.node_ids),\n                        \"candidate_count\": len(candidates),\n                        \"selected\": [c.state.current_node.id for c in node.children],\n                    })\n                if not node.children:\n                    break\n                node = (max(node.children, key=lambda c: self.value(c.state)) if rollout\n                        else self._select(node.children, node.visits))\n                rollout = rollout or node.visits == 0\n                path.append(node)\n            reward = self.value(node.state)\n            for ancestor in path:\n                ancestor.visits += 1\n                ancestor.value_sum += reward\n            terminals[node.state.trajectory.node_ids] = node.state\n            self.simulations += 1\n        return sorted(terminals.values(), key=lambda s: (\n            -self.value(s), s.trajectory.node_ids))[:self.width]\n\n    def statistics(self) -> list[dict[str, object]]:\n        result: list[dict[str, object]] = []\n        pending = list(self.roots)\n        while pending:\n            node = pending.pop(0)\n            result.append({\"path\": list(node.state.trajectory.node_ids), \"visits\": node.visits,\n                           \"mean_value\": node.mean_value, \"prior\": node.prior})\n            pending.extend(node.children)\n        return result","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_1a8455f085d1a8d2a3a090fca0e9d738","label":"__init__","qualifiedName":"src/sckg/retrieval/egpot/mcts.py:BeamMCTS.__init__","kind":"function","file":"src/sckg/retrieval/egpot/mcts.py","line":38,"sourceText":"    def __init__(self, config: EGPOTConfig, max_hops: int, width: int) -> None:\n        self.config = config\n        self.max_hops = max_hops\n        self.width = width\n        self.roots: list[SearchNode] = []\n        self.trace: list[dict[str, object]] = []\n        self.simulatio n, node.visits))\n                rollout = rollout or node.visits == 0\n                path.append(node)\n            reward = self.value(node.state)\n            for ancestor in path:\n                ancestor.visits += 1\n                ancestor.value_sum += reward\n            terminals[node.state.trajectory.node_ids] = node.state\n            self.simulations += 1\n        return sorted(terminals.values(), key=lambda s: (\n            -self.value(s), s.trajectory.node_ids))[:self.width]","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_cffa7062a4b4e3b6d0799ff84765d9ba","label":"statistics","qualifiedName":"src/sckg/retrieval/egpot/mcts.py:BeamMCTS.statistics","kind":"function","file":"src/sckg/retrieval/egpot/mcts.py","line":109,"sourceText":"    def statistics(self) -> list[dict[str, object]]:\n        result: list[dict[str, object]] = []\n        pending = list(self.roots)\n        while pending:\n            node = pending.pop(0)\n            result.append({\"path\": list(node.state.trajectory.node_ids), \"visits\": node.visits,\n                           \"mean_value\": node.mean_value, \"prior\": node.prior})\n            pending.extend(node.children)\n        return result","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_7a93337249e69c7f1bdbbc14d99ab573","label":"models.py","qualifiedName":"file::src/sckg/retrieval/egpot/models.py","kind":"file","file":"src/sckg/retrieval/egpot/models.py","line":1,"sourceText":"# File: src/sckg/retrieval/egpot/models.py\n# Lines: 157","layer":"Lsyn","color":"#5b8def","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_db5c6b07252512ac92336dbc36ad174f","label":"StopReason","qualifiedName":"src/sckg/retrieval/egpot/models.py:StopReason","kind":"class","file":"src/sckg/retrieval/egpot/models.py","line":11,"sourceText":"class StopReason(StrEnum):\n    MAX_HOPS = \"MAX_HOPS\"\n    NO_CANDIDATES = \"NO_CANDIDATES\"\n    TOKEN_BUDGET = \"TOKEN_BUDGET\"","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_79ead3ebca32081f7ece9bd411e6717f","label":"ContractStatus","qualifiedName":"src/sckg/retrieval/egpot/models.py:ContractStatus","kind":"class","file":"src/sckg/retrieval/egpot/models.py","line":17,"sourceText":"class ContractStatus(StrEnum):\n    EXACT = \"EXACT\"\n    COMPATIBLE = \"COMPATIBLE\"\n    UNKNOWN = \"UNKNOWN\"\n    INCONSISTENT = \"INCONSISTENT\"","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_8a39956ede71910ee1ea5136c11e4632","label":"ContractScore","qualifiedName":"src/sckg/retrieval/egpot/models.py:ContractScore","kind":"class","file":"src/sckg/retrieval/egpot/models.py","line":25,"sourceText":"class ContractScore:\n    score: float\n    status: ContractStatus\n    evidence: tuple[str, ...] = ()\n    provenance: tuple[str, ...] = ()","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_1ec8b1dcb32ec536a6826ac62d15b55d","label":"ObjectiveVector","qualifiedName":"src/sckg/retrieval/egpot/models.py:ObjectiveVector","kind":"class","file":"src/sckg/retrieval/egpot/models.py","line":33,"sourceText":"class ObjectiveVector:\n    semantic_relevance: float\n    hop_efficiency: float\n    contract_consistency: float\n    information_gain: float\n\n    def values(self) -> tuple[float, float, float, float]:\n        return (\n            self.semantic_relevance,\n            self.hop_efficiency,\n            self.contract_consistency,\n            self.information_gain,\n        )","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_c4f7d45c5a8da67bdf9b2acc8e26776c","label":"values","qualifiedName":"src/sckg/retrieval/egpot/models.py:ObjectiveVector.values","kind":"function","file":"src/sckg/retrieval/egpot/models.py","line":39,"sourceText":"    def values(self) -> tuple[float, float, float, float]:\n        return (\n            self.semantic_relevance,\n            self.hop_efficiency,\n            self.contract_consistency,\n            self.information_gain,\n        )","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_d7ff8bd26580512c3b50704f1a679478","label":"Hop","qualifiedName":"src/sckg/retrieval/egpot/models.py:Hop","kind":"class","file":"src/sckg/retrieval/egpot/models.py","line":49,"sourceText":"class Hop:\n    source: Symbol\n    relation: Relation\n    target: Symbol\n    hop_number: int\n    objective_vector: ObjectiveVector\n    entropy: float\n    novelty: float\n    contract: ContractScore\n    reason: str\n    pareto_rank: int | None = None\n    crowding_distance: float = 0.0","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_a76429aff65d9ee744d77f40121ef344","label":"Trajectory","qualifiedName":"src/sckg/retrieval/egpot/models.py:Trajectory","kind":"class","file":"src/sckg/retrieval/egpot/models.py","line":64,"sourceText":"class Trajectory:\n    nodes: tuple[Symbol, ...]\n    hops: tuple[Hop, ...] = ()\n\n    @property\n    def current_node(self) -> Symbol:\n        return self.nodes[-1]\n\n    @property\n    def depth(self) -> int:\n        return len(self.hops)\n\n    @property\n    def node_ids(self) -> tuple[str, ...]:\n        return tuple(node.id for node in self.nodes)\n\n    def creates_cycle(self, symbol: Symbol) -> bool:\n        return symbol.id in self.node_ids\n\n    def extend(\n        self,\n        relation: Relation,\n        target: Symbol,\n        objectives: ObjectiveVector,\n        entropy: float,\n        novelty: float,\n        contract: ContractScore,\n        reason: str,\n    ) -> Trajectory:\n        hop = Hop(\n            source=self.current_node,\n            relation=relation,\n            target=target,\n            hop_number=self.depth + 1,\n            objective_vector=objectives,\n            entropy=entropy,\n            novelty=novelty,\n            contract=contract,\n            reason=reason,\n        )\n        return Trajectory(nodes=(*self.nodes, target), hops=(*self.hops, hop))","layer":"Lsyn","color":"#f59e0b","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_aef8a42cc6a754b6af028f7b5c75cf1f","label":"current_node","qualifiedName":"src/sckg/retrieval/egpot/models.py:Trajectory.current_node","kind":"function","file":"src/sckg/retrieval/egpot/models.py","line":69,"sourceText":"    def current_node(self) -> Symbol:\n        return self.nodes[-1]","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_4bf7ea841bb4f6f108ace376bd4d1d15","label":"depth","qualifiedName":"src/sckg/retrieval/egpot/models.py:Trajectory.depth","kind":"function","file":"src/sckg/retrieval/egpot/models.py","line":73,"sourceText":"    def depth(self) -> int:\n        return len(self.hops)","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_53eec0bc4edf01b5e2292947e359922b","label":"node_ids","qualifiedName":"src/sckg/retrieval/egpot/models.py:Trajectory.node_ids","kind":"function","file":"src/sckg/retrieval/egpot/models.py","line":77,"sourceText":"    def node_ids(self) -> tuple[str, ...]:\n        return tuple(node.id for node in self.nodes)","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_f420e448412d8a8d6d334b4e32927e16","label":"creates_cycle","qualifiedName":"src/sckg/retrieval/egpot/models.py:Trajectory.creates_cycle","kind":"function","file":"src/sckg/retrieval/egpot/models.py","line":80,"sourceText":"    def creates_cycle(self, symbol: Symbol) -> bool:\n        return symbol.id in self.node_ids","layer":"Lsyn","color":"#10b981","egpotSelected":false,"egpotSeed":false,"egpotObjectives":[]},{"id":"sym_52e1fad680a047839d1
