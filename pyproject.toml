[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sckg"
version = "0.1.0"
description = "Phase 1 Semantic Code Knowledge Graph MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "neo4j>=5.20",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0,<6"]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10"]
benchmark = ["networkx>=3.2", "numpy>=1.24", "scipy>=1.11", "matplotlib>=3.7"]
parser = ["tree-sitter>=0.22", "tree-sitter-python>=0.21"]
graft = [
  "networkx>=3.0", "scikit-learn>=1.2", "tree-sitter>=0.25,<0.26",
  "tree-sitter-javascript>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24",
  "tree-sitter-go>=0.23,<0.24", "rank_bm25>=0.2",
]

[project.scripts]
sckg = "sckg.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sckg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
